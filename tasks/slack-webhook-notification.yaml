# tasks/slack-webhook-notification.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slack-webhook-notification
  annotations:
    description: |
      Posts a failure-alert message to Slack via an incoming webhook URL.
      Runs under the release-service-utils image (non-root) so it passes the
      restricted-v2 SCC, unlike the Konflux catalog bundle task it replaces.
      Referenced via git resolver from the fbc-post-release and update-bundle
      pipelines' finally blocks -- see VMER-1060.
      Treats a missing/empty secret as "notifications disabled" (exit 0), but
      fails the step on an actual delivery error so on-call notices when this,
      the only failure-alerting path, itself breaks.
spec:
  params:
    - name: message
      type: string
      description: The Slack message text to post.
    - name: secret-name
      type: string
      description: Name of the Secret holding the Slack webhook URL.
    - name: key-name
      type: string
      description: Key within the Secret holding the Slack webhook URL.
  steps:
    - name: send-notification
      image: quay.io/konflux-ci/release-service-utils@sha256:dd7fa6a8d8ade6fbc3ad30d974bb72cdefbdf7fd6a9eafa19c09d0146ece67c1
      timeout: "1m"
      env:
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: $(params.secret-name)
              key: $(params.key-name)
              optional: true
        - name: MESSAGE
          value: $(params.message)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        if [[ -z "${WEBHOOK_URL:-}" ]]; then
          echo "WARN: $(params.secret-name)/$(params.key-name) secret or key not found — skipping notification"
          exit 0
        fi

        if ! command -v jq >/dev/null 2>&1; then
          echo "ERROR: jq is not available in this image — cannot build the Slack payload"
          exit 1
        fi

        PAYLOAD=$(jq -n --arg msg "$MESSAGE" '{text: $msg}')

        MAX_ATTEMPTS=3
        HTTP_CODE=""
        for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 --max-time 15 \
            -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$WEBHOOK_URL")
          CURL_EXIT=$?

          if [[ "$CURL_EXIT" -eq 0 && "$HTTP_CODE" == "200" ]]; then
            echo "Slack notification sent successfully"
            exit 0
          fi

          echo "WARN: attempt ${ATTEMPT}/${MAX_ATTEMPTS} failed (curl exit ${CURL_EXIT}, HTTP ${HTTP_CODE:-none})"
          if [[ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]]; then
            sleep $((ATTEMPT * 2))
          fi
        done

        echo "ERROR: Slack webhook did not confirm delivery after ${MAX_ATTEMPTS} attempts (last HTTP ${HTTP_CODE:-none})"
        exit 1
