name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell tests
        run: |
          set -euo pipefail
          for test_script in tests/*.sh; do
            echo "=== ${test_script} ==="
            bash "${test_script}"
          done
