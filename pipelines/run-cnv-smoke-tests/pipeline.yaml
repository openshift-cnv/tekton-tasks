apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    pipelines.appstudio.openshift.io/type: build
  name: run-cnv-smoke-tests
spec:
  description: |
    TBD
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - description: Revision of the Source Repository
      default: ""
      name: revision
      type: string
    - description: Path to the source code of an application's component from where to build image.
      default: .
      name: path-context
      type: string
    - name: prow-job
      type: string
    - name: debug
      type: string
      default: "false"
      description: Enable debug mode with verbose output (set -x)
  tasks:
    - name: run-smoke-tests
      timeout: 4h0m0s
      params:
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: path-context
          value: $(params.path-context)
        - name: prow-job
          value: $(params.prow-job)
      taskSpec:
        params:
          - name: git-url
          - name: revision
          - name: path-context
          - name: prow-job
        results:
          - name: PR_NUMBER
            description: Pull request number associated with the source branch
          - name: IMAGE_DIGEST
            description: Digest of the image just built
          - name: IMAGE_URL
            description: Image repository and tag where the built image was pushed
          - name: IMAGES
            description: List of all referenced image manifests
          - name: IMAGE_REF
            description: Image reference of the built image containing both the repository and the digest
          - name: SBOM_BLOB_URL
            description: Reference of SBOM blob digest to enable digest-based verification from provenance
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
          - name: github-app-private-key
            secret:
              secretName: github-secrets
              items:
                - key: GITHUB_APP_PRIVATE_KEY
                  path: github_app_private_key.pem
        steps:
          - name: trigger-prow-job-via-gangway
            image: quay.io/cnv-qe-devops/gangway:latest
            env:
              - name: GIT_REVISION
                value: $(params.revision)
              - name: GIT_REPOSITORY
                value: $(params.git-url)
              - name: PATH_CONTEXT
                value: $(params.path-context)
              - name: PROW_JOB_NAME
                value: $(params.prow-job)
              - name: GANGWAY_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GANGWAY_TOKEN
              - name: GIT_USER_NAME
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GIT_USER_NAME
              - name: GIT_USER_EMAIL
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GIT_USER_EMAIL

              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_APP_ID
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_TOKEN
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: github-app-private-key
                mountPath: /credentials/github-app
                readOnly: true
            script: |
              #!/bin/bash

              set -xeuo pipefail

              git clone "${GIT_REPOSITORY}" repo && pushd "repo/${PATH_CONTEXT}" && git checkout "${GIT_REVISION}"

              SOURCE_BRANCH=$(git branch -r --contains HEAD | grep -v '/HEAD' | head -1 | sed 's|.*origin/||' | xargs)
              echo "Source branch resolved: ${SOURCE_BRANCH}"

              REPO_SLUG=$(echo "${GIT_REPOSITORY}" | sed -E 's|.*github\.com[:/]||; s|\.git$||')
              GH_API="https://api.github.com/repos/${REPO_SLUG}"
              AUTH_HEADER="Authorization: token ${GITHUB_TOKEN}"

              # Find open PR — try branch name first (most reliable), then commit SHA
              REPO_OWNER=$(echo "${REPO_SLUG}" | cut -d'/' -f1)
              ENCODED_BRANCH=$(printf '%s' "${SOURCE_BRANCH}" | jq -sRr @uri)
              ENCODED_HEAD=$(printf '%s' "${REPO_OWNER}:${SOURCE_BRANCH}" | jq -sRr @uri)

              echo "Looking up PR: repo=${REPO_SLUG} branch=${SOURCE_BRANCH} sha=${GIT_REVISION}"

              # Primary: search by branch name (owner:branch format)
              BRANCH_PR_RESPONSE=$(curl -s -H "${AUTH_HEADER}" \
                -H "Accept: application/vnd.github+json" \
                "${GH_API}/pulls?state=open&head=${ENCODED_HEAD}")
              PR_NUMBER=""
              if echo "${BRANCH_PR_RESPONSE}" | jq -e 'type == "array"' > /dev/null 2>&1; then
                PR_NUMBER=$(echo "${BRANCH_PR_RESPONSE}" | jq -r '.[0].number // empty')
              else
                echo "Branch lookup response: $(echo "${BRANCH_PR_RESPONSE}" | jq -r '.message // "unexpected format"')"
              fi

              if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
                # Fallback: search by commit SHA
                COMMIT_PR_RESPONSE=$(curl -s -H "${AUTH_HEADER}" \
                  -H "Accept: application/vnd.github+json" \
                  "${GH_API}/commits/${GIT_REVISION}/pulls")
                PR_NUMBER=""
                if echo "${COMMIT_PR_RESPONSE}" | jq -e 'type == "array"' > /dev/null 2>&1; then
                  PR_NUMBER=$(echo "${COMMIT_PR_RESPONSE}" | jq -r '[.[] | select(.state == "open")][0].number // empty')
                else
                  echo "Commit lookup response: $(echo "${COMMIT_PR_RESPONSE}" | jq -r '.message // "unexpected format"')"
                fi
              fi
              if [[ -n "${PR_NUMBER}" ]]; then
                echo "Open PR found: #${PR_NUMBER}"
              else
                echo "WARN: No open PR found for revision ${GIT_REVISION} or branch ${SOURCE_BRANCH}"
                PR_NUMBER=""
              fi
              echo -n "${PR_NUMBER}" > $(results.PR_NUMBER.path)

              export JOB_INFO_FILE="/tmp/prow.yaml"
              export CNV_OPERATOR_CHANNEL=$(yq '.channel' payload.yaml)
              export FREIGHT_NAME=$(yq '.freightName' payload.yaml)
              export HCO_BUNDLE_REGISTRY_BY_SHA=$(yq '.hco_bundle_registry_by_sha' payload.yaml)
              export HCO_BUNDLE_REGISTRY_BY_TAG=$(yq '.hco_bundle_registry_by_tag' payload.yaml)
              export HCO_BUNDLE_VERSION=$(yq '.hco_bundle_version' payload.yaml)
              export SNAPSHOT_ID=$(yq '.snapshot_id' payload.yaml)
              export CNV_CATALOG_IMAGE=$(yq '.index_image' payload.yaml)
              popd

              if [[ "${SOURCE_BRANCH}" == *dev* ]]; then
                echo "Dev branch detected — skipping gangway, using dummy values"
                export PROW_JOB_STATE="success"
                export PROW_JOB_URL="https://prow.ci.openshift.org/view/dummy-dev-job"
                export PROW_JOB_YAML="https://prow.ci.openshift.org/prowjob/dummy-dev-job.yaml"
              else
                uv run gangway.py \
                    --trigger "${PROW_JOB_NAME}" \
                    --write-job-info-file ${JOB_INFO_FILE} \
                    -e CNV_CATALOG_IMAGE=${CNV_CATALOG_IMAGE} \
                    -e CNV_OPERATOR_CHANNEL=${CNV_OPERATOR_CHANNEL} \
                    -e HCO_BUNDLE_VERSION=${HCO_BUNDLE_VERSION}

                PROW_JOB_ID=$(yq '.prowJobId' ${JOB_INFO_FILE})

                uv run gangway.py \
                --write-job-info-file ${JOB_INFO_FILE} \
                --wait-job-id ${PROW_JOB_ID} || exit_code=$?

                export PROW_JOB_STATE=$(yq '.prowJobState' ${JOB_INFO_FILE})
                export PROW_JOB_URL=$(yq '.prowJobUrl' ${JOB_INFO_FILE})
                export PROW_JOB_YAML=$(yq '.prowJobYamlUrl' ${JOB_INFO_FILE})
              fi

              pushd "repo/${PATH_CONTEXT}"


              yq --null-input \
                '
                .bundle        = env(HCO_BUNDLE_VERSION)   |
                .channel       = env(CNV_OPERATOR_CHANNEL) |
                .payloadCommit = env(GIT_REVISION)         |
                .prowJobUrl    = env(PROW_JOB_URL)         |
                .prowJobYaml   = env(PROW_JOB_YAML)        |
                .freightName   = env(FREIGHT_NAME)         |
                .smokeResults  = env(PROW_JOB_STATE)       |
                .snapshotID    = env(SNAPSHOT_ID)
                ' | yq 'sort_keys(..)' | tee smokeResults.yaml

              git config user.name "${GIT_USER_NAME}"
              git config user.email "${GIT_USER_EMAIL}"

              git add smokeResults.yaml
              git commit -m "🧪 Update Smoke Results For ${HCO_BUNDLE_VERSION}"

              git checkout -B "${SOURCE_BRANCH}"

              curl -s https://gist.githubusercontent.com/rabin-io/01ab7e1d72ebd60932fd1a8e913b6245/raw/git-push.sh \
                | bash -s -- "${GITHUB_APP_ID}" "/credentials/github-app/github_app_private_key.pem"

              exit ${exit_code:-0}

  finally:
    - name: manage-pull-request
      params:
        - name: pipeline-status
          value: $(tasks.status)
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: debug
          value: $(params.debug)
      taskSpec:
        params:
          - name: pipeline-status
          - name: git-url
          - name: revision
          - name: debug
        volumes:
          - name: github-app-private-key
            secret:
              secretName: github-secrets
              items:
                - key: GITHUB_APP_PRIVATE_KEY
                  path: github_app_private_key.pem
        steps:
          - name: merge-or-close-pr
            image: quay.io/cnv-qe-devops/gangway:latest
            env:
              - name: PIPELINE_STATUS
                value: $(params.pipeline-status)
              - name: GIT_REPOSITORY
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.revision)
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_APP_ID
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_TOKEN
            volumeMounts:
              - name: github-app-private-key
                mountPath: /credentials/github-app
                readOnly: true
            script: |
              #!/usr/bin/env bash

              # ============================================================
              # EXECUTION LAYER - Resilient wrapper for observability
              # ============================================================
              SCRIPT_START=$(date +%s)
              declare -a ACTION_LOG=()
              FINAL_EXIT_CODE=0

              if [[ "$(params.debug)" == "true" ]]; then
                set -x
              fi

              exec_action() {
                local action_name="$1"
                local timeout_secs="${2:-60}"
                shift 2
                local cmd="$*"

                local start_ts=$(date +%s)
                echo ""
                echo "┌─────────────────────────────────────────────────────────────"
                echo "│ ACTION: $action_name"
                echo "│ CMD: $cmd"
                echo "│ TIMEOUT: ${timeout_secs}s"
                echo "├─────────────────────────────────────────────────────────────"

                local output exit_code
                output=$(timeout "$timeout_secs" bash -c "$cmd" 2>&1)
                exit_code=$?

                local end_ts=$(date +%s)
                local duration=$((end_ts - start_ts))

                if [[ -n "$output" ]]; then
                  echo "$output" | sed 's/^/│ /'
                fi

                local status
                if [[ $exit_code -eq 0 ]]; then
                  status="OK"
                elif [[ $exit_code -eq 124 ]]; then
                  status="TIMEOUT"
                else
                  status="FAILED"
                fi

                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: $status (exit: $exit_code, duration: ${duration}s)"
                echo "└─────────────────────────────────────────────────────────────"

                ACTION_LOG+=("$status|$action_name|exit=$exit_code|${duration}s")
                return $exit_code
              }

              execution_summary() {
                local script_exit_code=$?
                local script_end=$(date +%s)
                local total_duration=$((script_end - SCRIPT_START))

                echo ""
                echo "╔═════════════════════════════════════════════════════════════"
                echo "║ EXECUTION SUMMARY - manage-pull-request"
                echo "║ Total Duration: ${total_duration}s"
                echo "║ Final Exit Code: ${FINAL_EXIT_CODE:-$script_exit_code}"
                echo "╠═════════════════════════════════════════════════════════════"

                local ok_count=0 fail_count=0 timeout_count=0

                for entry in "${ACTION_LOG[@]}"; do
                  local status=$(echo "$entry" | cut -d'|' -f1)
                  local action=$(echo "$entry" | cut -d'|' -f2)
                  local details=$(echo "$entry" | cut -d'|' -f3-)

                  case "$status" in
                    OK) ok_count=$((ok_count + 1)); echo "║ ✓ $action ($details)" ;;
                    FAILED) fail_count=$((fail_count + 1)); echo "║ ✗ $action ($details)" ;;
                    TIMEOUT) timeout_count=$((timeout_count + 1)); echo "║ ⏱ $action ($details)" ;;
                  esac
                done

                echo "╠═════════════════════════════════════════════════════════════"
                echo "║ OK: $ok_count | FAILED: $fail_count | TIMEOUT: $timeout_count"
                echo "╚═════════════════════════════════════════════════════════════"

                exit ${FINAL_EXIT_CODE:-$script_exit_code}
              }

              trap execution_summary EXIT

              # ============================================================
              # RUN LOGIC - Merge or close PR based on pipeline outcome
              # ============================================================
              set -eo pipefail

              # --- Validate inputs ---
              if [[ -z "${GIT_REPOSITORY}" ]]; then
                echo "ERROR: git-url is empty"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate git-url|exit=0|0s")

              if [[ -z "${GIT_REVISION}" ]]; then
                echo "ERROR: revision is empty"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate revision|exit=0|0s")

              # --- Setup GitHub API ---
              REPO_SLUG=$(echo "${GIT_REPOSITORY}" | sed -E 's|.*github\.com[:/]||; s|\.git$||')
              GH_API="https://api.github.com/repos/${REPO_SLUG}"
              AUTH_HEADER="Authorization: token ${GITHUB_TOKEN}"

              echo "Repository: ${REPO_SLUG}"
              echo "Revision:   ${GIT_REVISION}"
              echo "Pipeline Status: ${PIPELINE_STATUS}"

              # --- Discover PR number from revision ---
              echo "Looking up open PR for revision ${GIT_REVISION}..."

              # Try commit SHA lookup
              COMMIT_PR_RESPONSE=$(curl -s -H "${AUTH_HEADER}" \
                -H "Accept: application/vnd.github+json" \
                "${GH_API}/commits/${GIT_REVISION}/pulls")
              PR_NUMBER=""
              if echo "${COMMIT_PR_RESPONSE}" | jq -e 'type == "array"' > /dev/null 2>&1; then
                PR_NUMBER=$(echo "${COMMIT_PR_RESPONSE}" | jq -r '[.[] | select(.state == "open")][0].number // empty')
              else
                echo "Commit lookup response: $(echo "${COMMIT_PR_RESPONSE}" | jq -r '.message // "unexpected format"')"
              fi

              if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
                # Fallback: clone and resolve branch, then search by branch name
                echo "Commit lookup did not find PR, trying branch lookup..."
                SOURCE_BRANCH=$(git ls-remote --heads "${GIT_REPOSITORY}" \
                  | awk '{print $1, $2}' \
                  | grep "^${GIT_REVISION}" \
                  | head -1 \
                  | sed 's|.*refs/heads/||')
                if [[ -n "${SOURCE_BRANCH}" ]]; then
                  REPO_OWNER=$(echo "${REPO_SLUG}" | cut -d'/' -f1)
                  ENCODED_HEAD=$(printf '%s' "${REPO_OWNER}:${SOURCE_BRANCH}" | jq -sRr @uri)
                  BRANCH_PR_RESPONSE=$(curl -s -H "${AUTH_HEADER}" \
                    -H "Accept: application/vnd.github+json" \
                    "${GH_API}/pulls?state=open&head=${ENCODED_HEAD}")
                  if echo "${BRANCH_PR_RESPONSE}" | jq -e 'type == "array"' > /dev/null 2>&1; then
                    PR_NUMBER=$(echo "${BRANCH_PR_RESPONSE}" | jq -r '.[0].number // empty')
                  else
                    echo "Branch lookup response: $(echo "${BRANCH_PR_RESPONSE}" | jq -r '.message // "unexpected format"')"
                  fi
                else
                  echo "Could not resolve branch name from revision ${GIT_REVISION}"
                fi
              fi

              if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
                echo "INFO: No open PR found — skipping PR management"
                ACTION_LOG+=("OK|Skip - no PR found|exit=0|0s")
                FINAL_EXIT_CODE=0
                exit 0
              fi
              echo "Open PR found: #${PR_NUMBER}"
              ACTION_LOG+=("OK|Discover PR #${PR_NUMBER}|exit=0|0s")

              gh_api_call() {
                local method="$1" endpoint="$2" data="${3:-}"
                local response http_code

                if [[ -n "${data}" ]]; then
                  response=$(curl -s -w "\n%{http_code}" -X "${method}" \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "Content-Type: application/json" \
                    -d "${data}" \
                    "${GH_API}${endpoint}")
                else
                  response=$(curl -s -w "\n%{http_code}" -X "${method}" \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "${GH_API}${endpoint}")
                fi

                http_code=$(echo "${response}" | tail -1)
                local body
                body=$(echo "${response}" | sed '$d')

                if [[ "${http_code}" -ge 200 && "${http_code}" -lt 300 ]]; then
                  echo "${body}"
                  return 0
                else
                  echo "HTTP ${http_code}: $(echo "${body}" | jq -r '.message // "unknown error"')"
                  return 1
                fi
              }

              # --- Decide action based on pipeline status ---
              case "${PIPELINE_STATUS}" in
                Succeeded|Completed)
                  echo ""
                  echo "Pipeline SUCCEEDED — merging PR #${PR_NUMBER}"
                  if ! gh_api_call PUT "/pulls/${PR_NUMBER}/merge" \
                    "{\"merge_method\":\"merge\",\"commit_message\":\"Merged by smoke-test pipeline (status: ${PIPELINE_STATUS})\"}"; then
                    echo "ERROR: Failed to merge PR"
                    ACTION_LOG+=("FAILED|Merge PR #${PR_NUMBER}|exit=1|0s")
                    FINAL_EXIT_CODE=1
                    exit 1
                  fi
                  ACTION_LOG+=("OK|Merge PR #${PR_NUMBER}|exit=0|0s")
                  ;;

                Failed)
                  echo ""
                  echo "Pipeline FAILED — closing PR #${PR_NUMBER}"
                  gh_api_call POST "/issues/${PR_NUMBER}/comments" \
                    '{"body":"Smoke tests failed. Closing PR without merge."}' \
                    && ACTION_LOG+=("OK|Comment on PR #${PR_NUMBER}|exit=0|0s") \
                    || ACTION_LOG+=("FAILED|Comment on PR #${PR_NUMBER}|exit=1|0s")
                  if ! gh_api_call PATCH "/pulls/${PR_NUMBER}" '{"state":"closed"}'; then
                    echo "ERROR: Failed to close PR"
                    ACTION_LOG+=("FAILED|Close PR #${PR_NUMBER}|exit=1|0s")
                    FINAL_EXIT_CODE=1
                    exit 1
                  fi
                  ACTION_LOG+=("OK|Close PR #${PR_NUMBER}|exit=0|0s")
                  ;;

                None|*)
                  echo ""
                  echo "Pipeline CANCELLED/TIMEOUT (status: ${PIPELINE_STATUS}) — closing PR #${PR_NUMBER}"
                  gh_api_call POST "/issues/${PR_NUMBER}/comments" \
                    "{\"body\":\"Pipeline was cancelled or timed out (status: ${PIPELINE_STATUS}). Closing PR without merge.\"}" \
                    && ACTION_LOG+=("OK|Comment on PR #${PR_NUMBER}|exit=0|0s") \
                    || ACTION_LOG+=("FAILED|Comment on PR #${PR_NUMBER}|exit=1|0s")
                  if ! gh_api_call PATCH "/pulls/${PR_NUMBER}" '{"state":"closed"}'; then
                    echo "ERROR: Failed to close PR"
                    ACTION_LOG+=("FAILED|Close PR #${PR_NUMBER}|exit=1|0s")
                    FINAL_EXIT_CODE=1
                    exit 1
                  fi
                  ACTION_LOG+=("OK|Close PR #${PR_NUMBER}|exit=0|0s")
                  ;;
              esac

              FINAL_EXIT_CODE=0

  workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
