apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    pipelines.appstudio.openshift.io/type: build
  name: run-cnv-smoke-tests
spec:
  description: |
    TBD
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - description: Revision of the Source Repository
      default: ""
      name: revision
      type: string
    - description: Path to the source code of an application's component from where to build image.
      default: .
      name: path-context
      type: string
    - name: prow-job
      type: string
    - name: debug
      type: string
      default: "false"
      description: Enable debug mode with verbose output (set -x)
  tasks:
    - name: run-smoke-tests
      timeout: 4h0m0s
      params:
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: path-context
          value: $(params.path-context)
        - name: prow-job
          value: $(params.prow-job)
      taskSpec:
        params:
          - name: git-url
          - name: revision
          - name: path-context
          - name: prow-job
        results:
          - name: SMOKE_RESULTS_YAML
            description: Generated smokeResults.yaml content for the finally task to push
          - name: SOURCE_BRANCH
            description: Resolved branch name from the commit
          - name: HCO_BUNDLE_VERSION
            description: HCO bundle version for the commit message
          - name: PROW_EXIT_CODE
            description: Exit code from the Prow job (0=success, non-zero=failure)
          - name: IMAGE_DIGEST
            description: Digest of the image just built
          - name: IMAGE_URL
            description: Image repository and tag where the built image was pushed
          - name: IMAGES
            description: List of all referenced image manifests
          - name: IMAGE_REF
            description: Image reference of the built image containing both the repository and the digest
          - name: SBOM_BLOB_URL
            description: Reference of SBOM blob digest to enable digest-based verification from provenance
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
          - name: github-app-private-key
            secret:
              secretName: github-secrets
              items:
                - key: GITHUB_APP_PRIVATE_KEY
                  path: github_app_private_key.pem
        steps:
          - name: trigger-prow-job-via-gangway
            image: quay.io/cnv-qe-devops/gangway:latest
            env:
              - name: GIT_REVISION
                value: $(params.revision)
              - name: GIT_REPOSITORY
                value: $(params.git-url)
              - name: PATH_CONTEXT
                value: $(params.path-context)
              - name: PROW_JOB_NAME
                value: $(params.prow-job)
              - name: GANGWAY_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GANGWAY_TOKEN
              - name: GIT_USER_NAME
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GIT_USER_NAME
              - name: GIT_USER_EMAIL
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GIT_USER_EMAIL

              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_APP_ID
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_TOKEN
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: github-app-private-key
                mountPath: /credentials/github-app
                readOnly: true
            script: |
              #!/bin/bash

              set -xeuo pipefail

              git clone "${GIT_REPOSITORY}" repo && pushd "repo/${PATH_CONTEXT}" && git checkout "${GIT_REVISION}"

              SOURCE_BRANCH=$(git branch -r --contains HEAD | grep -v '/HEAD' | head -1 | sed 's|.*origin/||' | xargs)
              echo "Source branch resolved: ${SOURCE_BRANCH}"

              export JOB_INFO_FILE="/tmp/prow.yaml"
              export CNV_OPERATOR_CHANNEL=$(yq '.channel' payload.yaml)
              export FREIGHT_NAME=$(yq '.freightName' payload.yaml)
              export HCO_BUNDLE_REGISTRY_BY_SHA=$(yq '.hco_bundle_registry_by_sha' payload.yaml)
              export HCO_BUNDLE_REGISTRY_BY_TAG=$(yq '.hco_bundle_registry_by_tag' payload.yaml)
              export HCO_BUNDLE_VERSION=$(yq '.hco_bundle_version' payload.yaml)
              export SNAPSHOT_ID=$(yq '.snapshot_id' payload.yaml)
              export CNV_CATALOG_IMAGE=$(yq '.index_image' payload.yaml)
              popd

              if [[ "${SOURCE_BRANCH}" == dev/* ]]; then
                echo "Dev branch detected — skipping gangway, using dummy values"
                export PROW_JOB_STATE="success"
                export PROW_JOB_URL="https://prow.ci.openshift.org/view/dummy-dev-job"
                export PROW_JOB_YAML="https://prow.ci.openshift.org/prowjob/dummy-dev-job.yaml"
              else
                uv run gangway.py \
                    --trigger "${PROW_JOB_NAME}" \
                    --write-job-info-file ${JOB_INFO_FILE} \
                    -e CNV_CATALOG_IMAGE=${CNV_CATALOG_IMAGE} \
                    -e CNV_OPERATOR_CHANNEL=${CNV_OPERATOR_CHANNEL} \
                    -e HCO_BUNDLE_VERSION=${HCO_BUNDLE_VERSION}

                PROW_JOB_ID=$(yq '.prowJobId' ${JOB_INFO_FILE})

                uv run gangway.py \
                --write-job-info-file ${JOB_INFO_FILE} \
                --wait-job-id ${PROW_JOB_ID} || exit_code=$?

                export PROW_JOB_STATE=$(yq '.prowJobState' ${JOB_INFO_FILE})
                export PROW_JOB_URL=$(yq '.prowJobUrl' ${JOB_INFO_FILE})
                export PROW_JOB_YAML=$(yq '.prowJobYamlUrl' ${JOB_INFO_FILE})
              fi

              pushd "repo/${PATH_CONTEXT}"


              yq --null-input \
                '
                .bundle        = env(HCO_BUNDLE_VERSION)   |
                .channel       = env(CNV_OPERATOR_CHANNEL) |
                .payloadCommit = env(GIT_REVISION)         |
                .prowJobUrl    = env(PROW_JOB_URL)         |
                .prowJobYaml   = env(PROW_JOB_YAML)        |
                .freightName   = env(FREIGHT_NAME)         |
                .smokeResults  = env(PROW_JOB_STATE)       |
                .snapshotID    = env(SNAPSHOT_ID)
                ' | yq 'sort_keys(..)' | tee smokeResults.yaml

              echo -n "$(cat smokeResults.yaml)" > $(results.SMOKE_RESULTS_YAML.path)
              echo -n "${SOURCE_BRANCH}" > $(results.SOURCE_BRANCH.path)
              echo -n "${HCO_BUNDLE_VERSION}" > $(results.HCO_BUNDLE_VERSION.path)
              echo -n "${exit_code:-0}" > $(results.PROW_EXIT_CODE.path)

              # Always exit 0 so Tekton propagates results to the finally task.
              # The actual pass/fail is communicated via PROW_EXIT_CODE result.
              exit 0

  finally:
    - name: manage-pull-request
      params:
        - name: pipeline-status
          value: $(tasks.status)
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: path-context
          value: $(params.path-context)
        - name: smoke-results-yaml
          value: $(tasks.run-smoke-tests.results.SMOKE_RESULTS_YAML)
        - name: source-branch
          value: $(tasks.run-smoke-tests.results.SOURCE_BRANCH)
        - name: hco-bundle-version
          value: $(tasks.run-smoke-tests.results.HCO_BUNDLE_VERSION)
        - name: prow-exit-code
          value: $(tasks.run-smoke-tests.results.PROW_EXIT_CODE)
        - name: debug
          value: $(params.debug)
      taskSpec:
        params:
          - name: pipeline-status
          - name: git-url
          - name: revision
          - name: path-context
          - name: smoke-results-yaml
          - name: source-branch
          - name: hco-bundle-version
          - name: prow-exit-code
          - name: debug
        volumes:
          - name: github-app-private-key
            secret:
              secretName: github-secrets
              items:
                - key: GITHUB_APP_PRIVATE_KEY
                  path: github_app_private_key.pem
        steps:
          - name: merge-or-close-pr
            image: quay.io/cnv-qe-devops/gangway:latest
            env:
              - name: PIPELINE_STATUS
                value: $(params.pipeline-status)
              - name: GIT_REPOSITORY
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.revision)
              - name: PATH_CONTEXT
                value: $(params.path-context)
              - name: SMOKE_RESULTS_YAML
                value: $(params.smoke-results-yaml)
              - name: SOURCE_BRANCH
                value: $(params.source-branch)
              - name: HCO_BUNDLE_VERSION
                value: $(params.hco-bundle-version)
              - name: PROW_EXIT_CODE
                value: $(params.prow-exit-code)
              - name: GIT_USER_NAME
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GIT_USER_NAME
              - name: GIT_USER_EMAIL
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GIT_USER_EMAIL
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_APP_ID
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-secrets
                    key: GITHUB_TOKEN
            volumeMounts:
              - name: github-app-private-key
                mountPath: /credentials/github-app
                readOnly: true
            script: |
              #!/usr/bin/env bash

              # ============================================================
              # EXECUTION LAYER - Resilient wrapper for observability
              # ============================================================
              SCRIPT_START=$(date +%s)
              declare -a ACTION_LOG=()
              FINAL_EXIT_CODE=0

              if [[ "$(params.debug)" == "true" ]]; then
                set -x
              fi

              exec_action() {
                local action_name="$1"
                local timeout_secs="${2:-60}"
                shift 2
                local cmd="$*"

                local start_ts=$(date +%s)
                echo ""
                echo "┌─────────────────────────────────────────────────────────────"
                echo "│ ACTION: $action_name"
                echo "│ CMD: $cmd"
                echo "│ TIMEOUT: ${timeout_secs}s"
                echo "├─────────────────────────────────────────────────────────────"

                local output exit_code
                output=$(timeout "$timeout_secs" bash -c "$cmd" 2>&1)
                exit_code=$?

                local end_ts=$(date +%s)
                local duration=$((end_ts - start_ts))

                if [[ -n "$output" ]]; then
                  echo "$output" | sed 's/^/│ /'
                fi

                local status
                if [[ $exit_code -eq 0 ]]; then
                  status="OK"
                elif [[ $exit_code -eq 124 ]]; then
                  status="TIMEOUT"
                else
                  status="FAILED"
                fi

                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: $status (exit: $exit_code, duration: ${duration}s)"
                echo "└─────────────────────────────────────────────────────────────"

                ACTION_LOG+=("$status|$action_name|exit=$exit_code|${duration}s")
                return $exit_code
              }

              execution_summary() {
                local script_exit_code=$?
                local script_end=$(date +%s)
                local total_duration=$((script_end - SCRIPT_START))

                echo ""
                echo "╔═════════════════════════════════════════════════════════════"
                echo "║ EXECUTION SUMMARY - manage-pull-request"
                echo "║ Total Duration: ${total_duration}s"
                echo "║ Final Exit Code: ${FINAL_EXIT_CODE:-$script_exit_code}"
                echo "╠═════════════════════════════════════════════════════════════"

                local ok_count=0 fail_count=0 timeout_count=0

                for entry in "${ACTION_LOG[@]}"; do
                  local status=$(echo "$entry" | cut -d'|' -f1)
                  local action=$(echo "$entry" | cut -d'|' -f2)
                  local details=$(echo "$entry" | cut -d'|' -f3-)

                  case "$status" in
                    OK) ok_count=$((ok_count + 1)); echo "║ ✓ $action ($details)" ;;
                    FAILED) fail_count=$((fail_count + 1)); echo "║ ✗ $action ($details)" ;;
                    TIMEOUT) timeout_count=$((timeout_count + 1)); echo "║ ⏱ $action ($details)" ;;
                  esac
                done

                echo "╠═════════════════════════════════════════════════════════════"
                echo "║ OK: $ok_count | FAILED: $fail_count | TIMEOUT: $timeout_count"
                echo "╚═════════════════════════════════════════════════════════════"

                exit ${FINAL_EXIT_CODE:-$script_exit_code}
              }

              trap execution_summary EXIT

              # ============================================================
              # RUN LOGIC - Merge or close PR based on pipeline outcome
              # ============================================================
              set -eo pipefail

              # --- Validate inputs ---
              if [[ -z "${GIT_REPOSITORY}" ]]; then
                echo "ERROR: git-url is empty"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate git-url|exit=0|0s")

              if [[ -z "${GIT_REVISION}" ]]; then
                echo "ERROR: revision is empty"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate revision|exit=0|0s")

              # --- Generate GitHub App installation token ---
              # The GitHub App is installed on the upstream repo, not forks.
              # git-url may point to a fork, so we resolve the upstream via the API.
              REPO_SLUG=$(echo "${GIT_REPOSITORY}" | sed -E 's|.*github\.com[:/]||; s|\.git$||')
              APP_PEM="/credentials/github-app/github_app_private_key.pem"

              # Check if git-url is a fork — if so, use the parent (upstream) repo
              REPO_INFO=$(curl -s "https://api.github.com/repos/${REPO_SLUG}")
              IS_FORK=$(echo "${REPO_INFO}" | jq -r '.fork // false')
              if [[ "${IS_FORK}" == "true" ]]; then
                UPSTREAM_SLUG=$(echo "${REPO_INFO}" | jq -r '.parent.full_name')
                echo "Fork detected: ${REPO_SLUG} -> upstream: ${UPSTREAM_SLUG}"
                REPO_SLUG="${UPSTREAM_SLUG}"
              fi
              GH_API="https://api.github.com/repos/${REPO_SLUG}"

              NOW=$(date +%s)
              IAT=$((NOW - 60))
              EXP=$((NOW + 600))
              HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
              PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "${IAT}" "${EXP}" "${GITHUB_APP_ID}" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
              SIGNATURE=$(printf '%s.%s' "${HEADER}" "${PAYLOAD}" | openssl dgst -sha256 -sign "${APP_PEM}" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
              JWT="${HEADER}.${PAYLOAD}.${SIGNATURE}"

              INSTALLATION_ID=$(curl -s -H "Authorization: Bearer ${JWT}" \
                -H "Accept: application/vnd.github+json" \
                "${GH_API}/installation" | jq -r '.id')

              if [[ -z "${INSTALLATION_ID}" || "${INSTALLATION_ID}" == "null" ]]; then
                echo "ERROR: Could not find GitHub App installation for ${REPO_SLUG}"
                ACTION_LOG+=("FAILED|GitHub App auth|exit=1|0s")
                FINAL_EXIT_CODE=1
                exit 1
              fi

              GITHUB_TOKEN=$(curl -s -X POST \
                -H "Authorization: Bearer ${JWT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
                | jq -r '.token')

              if [[ -z "${GITHUB_TOKEN}" || "${GITHUB_TOKEN}" == "null" ]]; then
                echo "ERROR: Could not generate installation token"
                ACTION_LOG+=("FAILED|GitHub App token|exit=1|0s")
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|GitHub App auth|exit=0|0s")
              AUTH_HEADER="Authorization: token ${GITHUB_TOKEN}"

              echo "Repository: ${REPO_SLUG}"
              echo "Revision:   ${GIT_REVISION}"
              echo "Pipeline Status: ${PIPELINE_STATUS}"

              ORIG_REPO_SLUG=$(echo "${GIT_REPOSITORY}" | sed -E 's|.*github\.com[:/]||; s|\.git$||')

              # --- Discover PR number from revision ---
              echo "Looking up open PR for revision ${GIT_REVISION}..."
              echo "  git-url repo: ${ORIG_REPO_SLUG}"
              echo "  upstream repo: ${REPO_SLUG}"
              PR_NUMBER=""

              # Method 1: commits API — finds PRs containing this commit
              COMMIT_PR_RESPONSE=$(curl -s -H "${AUTH_HEADER}" \
                -H "Accept: application/vnd.github+json" \
                "${GH_API}/commits/${GIT_REVISION}/pulls" 2>/dev/null || true)
              if echo "${COMMIT_PR_RESPONSE}" | jq -e 'type == "array"' > /dev/null 2>&1; then
                PR_NUMBER=$(echo "${COMMIT_PR_RESPONSE}" | jq -r '[.[] | select(.state == "open")][0].number // empty')
                if [[ -n "${PR_NUMBER}" && "${PR_NUMBER}" != "null" ]]; then
                  echo "Found PR via commits API: #${PR_NUMBER}"
                fi
              fi

              # Method 2: List open PRs and match — first by head SHA, then by
              # head repo+ref (branch name survives new pushes to the branch)
              if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
                echo "Commits API did not find PR, scanning open PRs..."
                PAGE=1
                while [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; do
                  PR_LIST=$(curl -s -H "${AUTH_HEADER}" \
                    -H "Accept: application/vnd.github+json" \
                    "${GH_API}/pulls?state=open&per_page=100&page=${PAGE}")
                  if ! echo "${PR_LIST}" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
                    break
                  fi
                  # Try exact head SHA match first
                  PR_NUMBER=$(echo "${PR_LIST}" | jq -r \
                    --arg sha "${GIT_REVISION}" \
                    '[.[] | select(.head.sha == $sha)][0].number // empty')
                  # If SHA didn't match (commit was pushed after pipeline started),
                  # match by head repo — the PR from this repo/fork
                  if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
                    PR_NUMBER=$(echo "${PR_LIST}" | jq -r \
                      --arg repo "${ORIG_REPO_SLUG}" \
                      '[.[] | select(.head.repo.full_name == $repo)][0].number // empty')
                  fi
                  PAGE=$((PAGE + 1))
                  if [[ ${PAGE} -gt 10 ]]; then
                    echo "WARN: Searched 1000 open PRs without match, stopping"
                    break
                  fi
                done
              fi

              if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
                echo "INFO: No open PR found — skipping PR management"
                ACTION_LOG+=("OK|Skip - no PR found|exit=0|0s")
                FINAL_EXIT_CODE=0
                exit 0
              fi
              echo "Open PR found: #${PR_NUMBER}"
              ACTION_LOG+=("OK|Discover PR #${PR_NUMBER}|exit=0|0s")

              gh_api_call() {
                local method="$1" endpoint="$2" data="${3:-}"
                local response http_code

                if [[ -n "${data}" ]]; then
                  response=$(curl -s -w "\n%{http_code}" -X "${method}" \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "Content-Type: application/json" \
                    -d "${data}" \
                    "${GH_API}${endpoint}")
                else
                  response=$(curl -s -w "\n%{http_code}" -X "${method}" \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "${GH_API}${endpoint}")
                fi

                http_code=$(echo "${response}" | tail -1)
                local body
                body=$(echo "${response}" | sed '$d')

                if [[ "${http_code}" -ge 200 && "${http_code}" -lt 300 ]]; then
                  echo "${body}"
                  return 0
                else
                  echo "HTTP ${http_code}: $(echo "${body}" | jq -r '.message // "unknown error"')"
                  return 1
                fi
              }

              # --- Decide action based on Prow exit code ---
              # The main task always exits 0 (so results propagate). The actual
              # pass/fail is determined by PROW_EXIT_CODE.
              echo "Prow exit code: ${PROW_EXIT_CODE}"

              if [[ "${PROW_EXIT_CODE}" == "0" ]]; then
                echo ""
                echo "Smoke tests PASSED — merging PR #${PR_NUMBER}"
                if ! gh_api_call PUT "/pulls/${PR_NUMBER}/merge" \
                  "{\"merge_method\":\"merge\",\"commit_message\":\"Merged by smoke-test pipeline (prow exit: ${PROW_EXIT_CODE})\"}"; then
                  echo "ERROR: Failed to merge PR"
                  ACTION_LOG+=("FAILED|Merge PR #${PR_NUMBER}|exit=1|0s")
                  FINAL_EXIT_CODE=1
                  exit 1
                fi
                ACTION_LOG+=("OK|Merge PR #${PR_NUMBER}|exit=0|0s")
              else
                echo ""
                echo "Smoke tests FAILED (prow exit: ${PROW_EXIT_CODE}) — closing PR #${PR_NUMBER}"
                gh_api_call POST "/issues/${PR_NUMBER}/comments" \
                  "{\"body\":\"Smoke tests failed (prow exit code: ${PROW_EXIT_CODE}). Closing PR without merge.\"}" \
                  && ACTION_LOG+=("OK|Comment on PR #${PR_NUMBER}|exit=0|0s") \
                  || ACTION_LOG+=("FAILED|Comment on PR #${PR_NUMBER}|exit=1|0s")
                if ! gh_api_call PATCH "/pulls/${PR_NUMBER}" '{"state":"closed"}'; then
                  echo "ERROR: Failed to close PR"
                  ACTION_LOG+=("FAILED|Close PR #${PR_NUMBER}|exit=1|0s")
                  FINAL_EXIT_CODE=1
                  exit 1
                fi
                ACTION_LOG+=("OK|Close PR #${PR_NUMBER}|exit=0|0s")
              fi

              # --- Push smokeResults.yaml AFTER merge/close ---
              # Push to the source branch so results are recorded. Uses [skip ci]
              # to prevent PaC from triggering a new pipeline on this push.
              if [[ -n "${SMOKE_RESULTS_YAML}" && -n "${SOURCE_BRANCH}" ]]; then
                echo ""
                echo "Pushing smokeResults.yaml to branch ${SOURCE_BRANCH}..."
                PUSH_DIR=$(mktemp -d)
                if git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${ORIG_REPO_SLUG}.git" "${PUSH_DIR}" && \
                   pushd "${PUSH_DIR}/${PATH_CONTEXT}" && \
                   git checkout "${GIT_REVISION}"; then
                  echo "${SMOKE_RESULTS_YAML}" > smokeResults.yaml
                  git config user.name "${GIT_USER_NAME}"
                  git config user.email "${GIT_USER_EMAIL}"
                  git add smokeResults.yaml
                  git commit -m "Update Smoke Results For ${HCO_BUNDLE_VERSION} [skip ci]"
                  git checkout -B "${SOURCE_BRANCH}"
                  git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_SLUG}.git"
                  git push origin "${SOURCE_BRANCH}" || echo "WARN: Push failed (branch may have been deleted after merge)"
                  popd
                  ACTION_LOG+=("OK|Push smokeResults.yaml|exit=0|0s")
                else
                  echo "WARN: Failed to clone/checkout for push"
                  ACTION_LOG+=("FAILED|Push smokeResults.yaml|exit=1|0s")
                fi
                rm -rf "${PUSH_DIR}"
              fi

              FINAL_EXIT_CODE=0

  workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
