---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: update-bundle
spec:
  description: This tasks gets all the required data of an FBC build and commits it to a payload repository to be used in a GitOps environment.
  params:
    - name: snapshot
      type: string
    - name: skeleton-chart-version
      type: string
      default: "0.0.0-skeleton"
    - name: debug
      type: string
      default: "false"
      description: Enable debug mode with verbose output (set -x)
  tasks:
    - name: update-bundle
      params:
        - name: SNAPSHOT
          value: "$(params.snapshot)"
        - name: SKELETON_CHART_VERSION
          value: "$(params.skeleton-chart-version)"
        - name: DEBUG
          value: "$(params.debug)"
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
          - name: SKELETON_CHART_VERSION
            type: string
          - name: DEBUG
            type: string
        results:
          - name: snapshots-to-release
            description: Contents of the snapshots.json file
          - name: bundle-version
            description: NVR of the bundle
        volumes:
          - name: quay-creds
            secret:
              secretName: quay-builds-creds
          - name: shared-data
            emptyDir: {}
        steps:
          - name: update-bundle
            image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
            envFrom:
              - secretRef:
                  name: hco-updater-gitlab-token
            volumeMounts:
              - name: shared-data
                mountPath: /var/shared
            script: |
              #!/usr/bin/env bash

              # ============================================================
              # EXECUTION LAYER - Resilient wrapper for observability
              # ============================================================
              SCRIPT_START=$(date +%s)
              declare -a ACTION_LOG=()
              FINAL_EXIT_CODE=0

              # Enable debug mode if requested
              if [[ "$(params.DEBUG)" == "true" ]]; then
                set -x
              fi

              exec_action() {
                local action_name="$1"
                local timeout_secs="${2:-60}"
                shift 2
                local cmd="$*"
                
                local start_ts=$(date +%s)
                echo ""
                echo "┌─────────────────────────────────────────────────────────────"
                echo "│ ACTION: $action_name"
                echo "│ CMD: $cmd"
                echo "│ TIMEOUT: ${timeout_secs}s"
                echo "├─────────────────────────────────────────────────────────────"
                
                local output
                local exit_code
                output=$(timeout "$timeout_secs" bash -c "$cmd" 2>&1)
                exit_code=$?
                
                local end_ts=$(date +%s)
                local duration=$((end_ts - start_ts))
                
                if [[ -n "$output" ]]; then
                  echo "$output" | sed 's/^/│ /'
                fi
                
                local status
                if [[ $exit_code -eq 0 ]]; then
                  status="OK"
                elif [[ $exit_code -eq 124 ]]; then
                  status="TIMEOUT"
                else
                  status="FAILED"
                fi
                
                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: $status (exit: $exit_code, duration: ${duration}s)"
                echo "└─────────────────────────────────────────────────────────────"
                
                ACTION_LOG+=("$status|$action_name|exit=$exit_code|${duration}s")
                return $exit_code
              }

              execution_summary() {
                local script_exit_code=$?
                local script_end=$(date +%s)
                local total_duration=$((script_end - SCRIPT_START))
                
                echo ""
                echo "╔═════════════════════════════════════════════════════════════"
                echo "║ EXECUTION SUMMARY - update-bundle"
                echo "║ Total Duration: ${total_duration}s"
                echo "║ Final Exit Code: ${FINAL_EXIT_CODE:-$script_exit_code}"
                echo "╠═════════════════════════════════════════════════════════════"
                
                local ok_count=0 fail_count=0 timeout_count=0
                
                for entry in "${ACTION_LOG[@]}"; do
                  local status=$(echo "$entry" | cut -d'|' -f1)
                  local action=$(echo "$entry" | cut -d'|' -f2)
                  local details=$(echo "$entry" | cut -d'|' -f3-)
                  
                  case "$status" in
                    OK) ok_count=$((ok_count + 1)); echo "║ ✓ $action ($details)" ;;
                    FAILED) fail_count=$((fail_count + 1)); echo "║ ✗ $action ($details)" ;;
                    TIMEOUT) timeout_count=$((timeout_count + 1)); echo "║ ⏱ $action ($details)" ;;
                  esac
                done
                
                echo "╠═════════════════════════════════════════════════════════════"
                echo "║ OK: $ok_count | FAILED: $fail_count | TIMEOUT: $timeout_count"
                echo "╚═════════════════════════════════════════════════════════════"
                
                exit ${FINAL_EXIT_CODE:-$script_exit_code}
              }

              trap execution_summary EXIT

              # ============================================================
              # RUN LOGIC - Business logic with fail-fast behavior
              # ============================================================
              set -eo pipefail

              echo "=== PHASE 1: Fetching snapshot data ==="

              # Validate SNAPSHOT parameter
              if [[ -z "$(params.SNAPSHOT)" ]]; then
                echo "ERROR: SNAPSHOT parameter is empty"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate SNAPSHOT parameter|exit=0|0s")

              SNAPSHOT_ID=$(echo "$(params.SNAPSHOT)" | awk -F'/' '{print $2}')
              if [[ -z "$SNAPSHOT_ID" ]]; then
                echo "ERROR: Could not extract SNAPSHOT_ID from: $(params.SNAPSHOT)"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Extract SNAPSHOT_ID|exit=0|0s")
              echo "│ Snapshot ID: $SNAPSHOT_ID"

              if ! exec_action "Fetch snapshot from Kubernetes" 60 "kubectl get snapshot $SNAPSHOT_ID -ojson"; then
                echo "ERROR: Failed to fetch snapshot $SNAPSHOT_ID"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              SNAPSHOT_DATA=$(kubectl get snapshot $SNAPSHOT_ID -ojson)

              # Validate JSON response
              if ! echo "$SNAPSHOT_DATA" | jq -e . > /dev/null 2>&1; then
                echo "ERROR: Invalid JSON response from kubectl"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate snapshot JSON|exit=0|0s")

              NAMESPACE=$(jq -r '.metadata.namespace' <<< "$SNAPSHOT_DATA")
              APPLICATION=$(jq -r '.spec.application' <<< "$SNAPSHOT_DATA")
              VERSION=$(echo "$NAMESPACE" | cut -d'-' -f1,2)
              echo "│ Namespace: $NAMESPACE"
              echo "│ Application: $APPLICATION"
              echo "│ Version: $VERSION"

              echo "=== PHASE 2: Cloning hco-bundle-registry ==="

              # Validate GITLAB_TOKEN
              if [[ -z "${GITLAB_TOKEN:-}" ]]; then
                echo "ERROR: GITLAB_TOKEN environment variable is not set"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate GITLAB_TOKEN|exit=0|0s")

              REPO_URL="https://gitlab.cee.redhat.com/openshift-virtualization/konflux-builds/${VERSION}/hco-bundle-registry.git"
              REPO_URL_WITH_AUTH=$(echo "$REPO_URL" | sed "s|https://|https://oauth2:${GITLAB_TOKEN}@|")

              if ! exec_action "Clone hco-bundle-registry" 120 "git clone $REPO_URL_WITH_AUTH --depth 50 hco-bundle-registry"; then
                echo "ERROR: Failed to clone repository"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              cd hco-bundle-registry
              git remote set-url origin "$REPO_URL_WITH_AUTH"
              git config user.name "submodule-sync"
              git config user.email "no-reply@redhat.com"
              ACTION_LOG+=("OK|Configure git identity|exit=0|0s")

              echo "=== PHASE 3: Validating commit consistency ==="
              IMAGES=$(jq -r '.spec.components[].containerImage' <<< "$SNAPSHOT_DATA")

              # Check commit consistency directly -- large JSON can't be passed safely through exec_action
              echo ""
              echo "┌─────────────────────────────────────────────────────────────"
              echo "│ ACTION: Validate commit consistency"
              echo "│ CMD: jq '[.spec.components[].source.git.revision] | unique | length' /tmp/snapshot.json"
              echo "│ TIMEOUT: 30s"
              echo "├─────────────────────────────────────────────────────────────"

              echo "$SNAPSHOT_DATA" > /tmp/snapshot.json
              consistency_exit=0
              UNIQUE_COUNT=$(jq '[.spec.components[].source.git.revision] | unique | length' /tmp/snapshot.json 2>&1) || consistency_exit=$?

              if [[ $consistency_exit -ne 0 ]]; then
                echo "│ ERROR: jq failed to parse snapshot data" | sed 's/^/│ /'
                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: FAILED (exit: $consistency_exit, duration: 0s)"
                echo "└─────────────────────────────────────────────────────────────"
                ACTION_LOG+=("FAILED|Validate commit consistency|exit=$consistency_exit|0s")
                FINAL_EXIT_CODE=1
                exit 1
              fi

              COMPONENT_COUNT=$(jq '.spec.components | length' /tmp/snapshot.json)

              if [[ "$UNIQUE_COUNT" -eq 0 ]]; then
                echo "│ WARN: Snapshot contains no components"
                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: FAILED (exit: 1, duration: 0s)"
                echo "└─────────────────────────────────────────────────────────────"
                ACTION_LOG+=("FAILED|Validate commit consistency|exit=1|0s")
                FINAL_EXIT_CODE=1
                exit 1
              elif [[ "$UNIQUE_COUNT" -eq 1 ]]; then
                echo "│ OK: All $COMPONENT_COUNT components point to the same commit"
                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: OK (exit: 0, duration: 0s)"
                echo "└─────────────────────────────────────────────────────────────"
                ACTION_LOG+=("OK|Validate commit consistency|exit=0|0s")
              else
                echo "│ WARN: $UNIQUE_COUNT unique revisions across $COMPONENT_COUNT components"
                echo "│ Component revisions:"
                jq -r '.spec.components[] | "│   \(.name): \(.source.git.revision)"' /tmp/snapshot.json
                echo "│ Unique revisions:"
                jq -r '[.spec.components[].source.git.revision] | unique | .[] | "│   \(.)"' /tmp/snapshot.json
                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: WARN (exit: 0, duration: 0s)"
                echo "└─────────────────────────────────────────────────────────────"
                ACTION_LOG+=("WARN|Validate commit consistency|exit=0|0s")
                FINAL_EXIT_CODE=0
                exit 0
              fi

              rm -f /tmp/snapshot.json

              # Save Snapshot object for GC resilience (stripped, with velero label)
              if [[ "$APPLICATION" != *"-test-"* ]]; then
                snapshot_objects_dir="components/hco-bundle-registry/snapshot-objects"
                mkdir -p "$snapshot_objects_dir"
                if ! exec_action "Save Snapshot object for ${APPLICATION}" 30 "set -o pipefail; kubectl get snapshot '$SNAPSHOT_ID' -oyaml | yq 'del(.metadata.ownerReferences) | .metadata.labels[\"velero.io/restore-name\"] = \"snapshot-persistence\"' > '${snapshot_objects_dir}/${APPLICATION}.yaml'"; then
                  echo "WARN: Failed to save Snapshot object for ${APPLICATION} (non-fatal)"
                fi
              fi

              # Define snapshots_file outside function so it's available in main script
              snapshots_file="components/hco-bundle-registry/snapshots.json"

              function update_images_snapshots() {
                for img in $IMAGES; do
                  image_name_sha=$(echo "${img##*/}")
                  image_name=$(echo "$image_name_sha" | cut -d'@' -f1)

                  # Virt-platform-autopilot should also be in the core-params
                  if [[ ("$image_name" == *"-operator"* || "$image_name" == *"virt-platform-autopilot"*) && "$image_name" != *"-test-"* ]]; then
                    json_file="components/hco-bundle-registry/core-params.json"
                  else
                    json_file="components/hco-bundle-registry/extra-params.json"
                  fi
                  jq -S ".\"${image_name}-image\" = \"${image_name_sha}\"" "$json_file" > "${json_file}.tmp" && mv "${json_file}.tmp" "$json_file"
                done

                touch ${snapshots_file}
                if [[ ! "$APPLICATION" == *"-test-"* ]]; then
                  jq -n \
                    --slurpfile f "$snapshots_file" \
                    --arg app "$APPLICATION" \
                    --arg snap "$SNAPSHOT_ID" \
                    '$f[0] // {} | .[$app] = $snap' \
                  > "$snapshots_file.tmp" \
                  && mv "$snapshots_file.tmp" "$snapshots_file"
                else
                  echo "Test application, skipping snapshot being added to the bundle, as it won't be released"
                fi
              }

              echo "=== PHASE 4: Updating image references ==="
              # Export function AND variables needed by function when run in subshell via exec_action
              export -f update_images_snapshots
              export IMAGES APPLICATION SNAPSHOT_ID snapshots_file
              if ! exec_action "Update image references" 60 "update_images_snapshots"; then
                echo "ERROR: Failed to update image references"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              echo "=== PHASE 4b: Saving repo to shared volume for CSV generation ==="
              rm -rf /var/shared/hco-bundle-registry-work
              cp -r . /var/shared/hco-bundle-registry-work
              ACTION_LOG+=("OK|Save repo to shared volume|exit=0|0s")
              echo "│ OK: Repo copied to /var/shared/hco-bundle-registry-work"

              # Copy Snapshot objects to shared volume for push-release-chart step
              mkdir -p /var/shared/snapshot-objects
              cp components/hco-bundle-registry/snapshot-objects/*.yaml /var/shared/snapshot-objects/ 2>/dev/null || true

              if [[ "$(params.SNAPSHOT)" == *"hco-bundle-registry"* ]]; then
                echo "=== PHASE 6: Preparing release data for hco-bundle-registry ==="
                REPO_REVISION=$(jq -r '.spec.components[0].source.git.revision' <<< "$SNAPSHOT_DATA")
                echo "│ Repo revision: $REPO_REVISION"

                if [[ ! -f "build-bundle.json" ]]; then
                  echo "ERROR: build-bundle.json not found"
                  FINAL_EXIT_CODE=1
                  exit 1
                fi
                
                BUNDLE_VERSION=$(cat build-bundle.json | jq -r '.metadata.Version | "\(.XY).\(.Z)-\(.os).\(.release)" | sub("^v"; "")')
                if [[ -z "$BUNDLE_VERSION" || "$BUNDLE_VERSION" == "null" ]]; then
                  echo "ERROR: Failed to extract bundle version"
                  FINAL_EXIT_CODE=1
                  exit 1
                fi
                echo "│ Bundle version: $BUNDLE_VERSION"
                ACTION_LOG+=("OK|Extract bundle version|exit=0|0s")
                
                echo -n "$BUNDLE_VERSION" > /tekton/results/bundle-version
                if [[ ! -f "/tekton/results/bundle-version" ]]; then
                  echo "ERROR: Failed to write bundle-version result"
                  FINAL_EXIT_CODE=1
                  exit 1
                fi
                ACTION_LOG+=("OK|Write bundle-version result|exit=0|0s")

                if ! exec_action "Checkout release revision" 30 "git checkout $REPO_REVISION"; then
                  echo "ERROR: Failed to checkout revision $REPO_REVISION"
                  FINAL_EXIT_CODE=1
                  exit 1
                fi
                
                update_images_snapshots
                ACTION_LOG+=("OK|Update images for release|exit=0|0s")

                SNAPSHOTS_TO_RELEASE=$(cat $snapshots_file)
                echo -n "$SNAPSHOTS_TO_RELEASE" > /tekton/results/snapshots-to-release
                if [[ ! -f "/tekton/results/snapshots-to-release" ]]; then
                  echo "ERROR: Failed to write snapshots-to-release result"
                  FINAL_EXIT_CODE=1
                  exit 1
                fi
                ACTION_LOG+=("OK|Write snapshots-to-release result|exit=0|0s")
                echo "│ OK: Release data written to results"
              fi

              echo "=== update-bundle step completed ==="
              FINAL_EXIT_CODE=0
          - name: generate-csvs
            image: quay.io/konflux-ci/task-runner:3.1.1@sha256:790df1bb5ea7a9ce4c1717ff341398ff72c99faed1c2e939a3b4a15ff8f4a493
            envFrom:
              - secretRef:
                  name: hco-updater-gitlab-token
            volumeMounts:
              - name: quay-creds
                mountPath: /tmp/quay-builds-creds
                readOnly: true
              - name: shared-data
                mountPath: /var/shared
            script: |
              #!/usr/bin/env bash
              set -eo pipefail

              WORK_DIR="/var/shared/hco-bundle-registry-work"
              HCO_PATH="${WORK_DIR}/components/hco-bundle-registry"
              CSV_BASE="${HCO_PATH}/csvs"
              CRD_DIR="${HCO_PATH}/crds"
              AUTH_FILE="/tmp/quay-builds-creds/.dockerconfigjson"
              EXTRA="${HCO_PATH}/extra-params.json"
              CORE="${HCO_PATH}/core-params.json"
              VCONFIG="${HCO_PATH}/version-config.json"

              echo "=== generate-csvs ==="

              if [[ ! -d "${WORK_DIR}" ]]; then
                echo "ERROR: ${WORK_DIR} not found — update-bundle step did not copy the repo"
                exit 1
              fi

              cd "${WORK_DIR}"
              git config user.name "submodule-sync"
              git config user.email "no-reply@redhat.com"

              REPO_URL=$(git remote get-url origin | sed 's|https://oauth2:[^@]*@|https://|')
              git remote set-url origin "$(echo "$REPO_URL" | sed "s|https://|https://oauth2:${GITLAB_TOKEN}@|")"

              QUAY=$(jq -r '."quay-prefix"' "${CORE}")
              CSV_VER=$(jq -r '."csv-version"' "${EXTRA}")
              CSV_REPLACES=$(jq -r '."csv-version-replaces" // ""' "${EXTRA}")
              TARGET_NS=$(jq -r '."target-namespace"' "${EXTRA}")
              CONTAINER_PFX=$(jq -r '."container-prefix" // "registry.redhat.io/container-native-virtualization"' "${EXTRA}")

              XY=$(jq -r '.metadata.Version.XY' "${WORK_DIR}/build-bundle.json" 2>/dev/null || echo "0")
              Z=$(jq -r  '.metadata.Version.Z'  "${WORK_DIR}/build-bundle.json" 2>/dev/null || echo "0")
              OP_VER="${XY}.${Z}"

              VER_STR=$(jq -r '.version // "v0.0"' "${VCONFIG}" | sed 's/^v//')
              VER_NUM=$(( $(echo "$VER_STR" | cut -d. -f1) * 1000 + $(echo "$VER_STR" | cut -d. -f2) ))
              # v4.12 uses no -rhel9 suffix on image keys; v4.13+ uses -rhel9
              VER_SFX="-rhel9"; [[ "$VER_NUM" -lt 4013 ]] && VER_SFX=""
              # HPP operator key naming is irregular (rhel8-operator vs operator-rhel9)
              HPP_OP_KEY="hostpath-provisioner-operator-rhel9-image"
              HPP_PRV_KEY="hostpath-provisioner-rhel9-image"
              HPP_CSI_KEY="hostpath-csi-driver-rhel9-image"
              if [[ "$VER_NUM" -lt 4013 ]]; then
                HPP_OP_KEY="hostpath-provisioner-rhel8-operator-image"
                HPP_PRV_KEY="hostpath-provisioner-rhel8-image"
                HPP_CSI_KEY="hostpath-csi-driver-image"
              fi

              OPERATORS=$(jq -r '.operators[]?' "${VCONFIG}" 2>/dev/null || echo "")
              has_op()   { echo "${OPERATORS}" | grep -qx "$1"; }
              get_core() { jq -r ".[\"$1\"] // empty" "${CORE}"; }
              get_extra() { jq -r ".[\"$1\"] // empty" "${EXTRA}"; }

              # ── Selective regeneration — only rebuild CSVs whose images actually changed ──
              CHANGED_KEYS=$(git diff -- \
                components/hco-bundle-registry/core-params.json \
                components/hco-bundle-registry/extra-params.json | \
                grep '^+[^+]' | grep -oP '"[a-z][a-zA-Z0-9-]*"(?=\s*:)' | tr -d '"')

              if [[ -z "$CHANGED_KEYS" ]]; then
                echo "│ No image keys changed — skipping all CSV generation"
                git add . 2>/dev/null || true
                if [[ -n "$(git status --porcelain)" ]]; then
                  git commit -m "Update HCO bundle registry with new images"
                  git pull --rebase origin main && git push origin main
                fi
                echo "=== generate-csvs step completed ==="
                exit 0
              fi
              echo "│ Changed image keys: $CHANGED_KEYS"

              # Returns 0 if any of the provided image keys appear in CHANGED_KEYS
              keys_changed() {
                local key
                for key in "$@"; do
                  echo "$CHANGED_KEYS" | grep -qF "$key" && return 0
                done
                return 1
              }

              mkdir -p "${CSV_BASE}" "${CRD_DIR}"

              # Run csv-generator inside an operator container; stdout → outfile on host (non-fatal)
              # Set GEN_CSV_ENV=(KEY=VAL ...) before calling gen_csv to pass env vars to buildah run.
              GEN_CSV_ENV=()
              gen_csv() {
                local outfile="$1" full_image="$2" csv_bin="$3"
                shift 3
                local ctr env_flags=()
                for ev in "${GEN_CSV_ENV[@]}"; do env_flags+=(--env "$ev"); done
                GEN_CSV_ENV=()  # reset after each use
                ctr=$(buildah from --authfile "${AUTH_FILE}" --storage-driver vfs "${full_image}" 2>&1)
                if [[ $? -ne 0 ]]; then
                  echo "WARN: buildah from failed for ${full_image}: ${ctr}" >&2; return 0
                fi
                buildah run --storage-driver vfs "${env_flags[@]}" "${ctr}" -- "${csv_bin}" "$@" > "${outfile}" 2>&1 || \
                  echo "WARN: csv-generator failed for ${full_image}" >&2
                buildah rm --storage-driver vfs "${ctr}" 2>/dev/null || true
              }

              # ─── CNA ────────────────────────────────────────────────────────────────────
              echo "=== CNA CSV ==="
              mkdir -p "${CSV_BASE}/cna-csv"
              if has_op cna && keys_changed \
                cluster-network-addons-operator-rhel9-image cluster-network-addons-operator-image \
                bridge-marker-rhel9-image bridge-marker-image \
                cnv-containernetworking-plugins-rhel9-image cnv-containernetworking-plugins-image \
                kubemacpool-rhel9-image kubemacpool-image \
                ovs-cni-plugin-rhel9-image ovs-cni-plugin-image \
                kubesecondarydns-rhel9-image \
                multus-dynamic-networks-rhel9-image \
                kubevirt-ipam-controller-rhel9-image \
                passt-network-binding-plugin-cni-rhel9-image kube-rbac-proxy-image core-dns-image; then
                CNA_IMG=$(get_core "cluster-network-addons-operator${VER_SFX}-image")
                CNA_SHA="${CNA_IMG#*@}"
                CNA_OP_NAME="cluster-network-addons-operator${VER_SFX}@sha256"
                KSD_IMG=$(get_extra "kubesecondarydns${VER_SFX}-image")
                MDN_IMG=$(get_extra "multus-dynamic-networks${VER_SFX}-image")
                IPAM_IMG=$(get_extra "kubevirt-ipam-controller-rhel9-image")
                PASST_IMG=""
                if [[ "$VER_NUM" -ge 4017 && "$VER_NUM" -lt 4019 ]]; then
                  PASST_IMG=$(get_extra "passt-network-binding-plugin-cni-rhel9-image")
                fi
                KSD_FLAG="--kube-secondary-dns"
                [[ "$VER_NUM" -ge 4017 ]] && KSD_FLAG="--kube-secondary-dns-image"
                CNA_ARGS=(
                  "--version=${CSV_VER}" "--version-replaces=${CSV_REPLACES}"
                  "--operator-version=${CNA_SHA}" "--namespace=${TARGET_NS}"
                  "--container-prefix=${CONTAINER_PFX}"
                  "--image-name=${CNA_OP_NAME}"
                  "--container-tag=${CNA_SHA#*:}"
                  "--multus-image=NOT_AVAILABLE" "--allow-multus=false"
                  "--linux-bridge-cni-image=${CONTAINER_PFX}/$(get_extra "cnv-containernetworking-plugins${VER_SFX}-image")"
                  "--linux-bridge-marker-image=${CONTAINER_PFX}/$(get_extra "bridge-marker${VER_SFX}-image")"
                  "--kubemacpool-image=${CONTAINER_PFX}/$(get_extra "kubemacpool${VER_SFX}-image")"
                  "--ovs-cni-image=${CONTAINER_PFX}/$(get_extra "ovs-cni-plugin${VER_SFX}-image")"
                  "--macvtap-cni-image=NOT_AVAILABLE" "--image-pull-policy=IfNotPresent" "--dump-crds"
                )
                # rbac-proxy and core-dns were added in v4.13+
                if [[ "$VER_NUM" -ge 4013 ]]; then
                  CNA_ARGS+=("--kube-rbac-proxy-image=$(get_extra 'kube-rbac-proxy-image')")
                  CNA_ARGS+=("--core-dns-image=$(get_extra 'core-dns-image')")
                fi
                [[ -n "$KSD_IMG" ]]  && CNA_ARGS+=("${KSD_FLAG}=${CONTAINER_PFX}/${KSD_IMG}")
                [[ -n "$MDN_IMG" ]]  && CNA_ARGS+=("--multus-dynamic-networks-image=${CONTAINER_PFX}/${MDN_IMG}")
                [[ -n "$IPAM_IMG" ]] && CNA_ARGS+=("--kubevirt-ipam-controller-image=${CONTAINER_PFX}/${IPAM_IMG}")
                [[ -n "$PASST_IMG" ]] && CNA_ARGS+=("--passt-binding-cni-image=${CONTAINER_PFX}/${PASST_IMG}")
                gen_csv "${CSV_BASE}/cna-csv/cna-csv-output.yaml" "${QUAY}/${CNA_IMG}" /usr/bin/csv-generator "${CNA_ARGS[@]}"
              else
                echo "  SKIP: cna not in operators list or no relevant image changed"
              fi

              # ─── Virt ───────────────────────────────────────────────────────────────────
              echo "=== Virt CSV ==="
              mkdir -p "${CSV_BASE}/virt-csv"
              if has_op virt && keys_changed \
                virt-operator-rhel9-image virt-operator-image \
                virt-api-rhel9-image virt-api-image \
                virt-controller-rhel9-image virt-controller-image \
                virt-handler-rhel9-image virt-handler-image \
                virt-launcher-rhel9-image virt-launcher-image \
                virt-exportproxy-rhel9-image virt-exportproxy-image \
                virt-exportserver-rhel9-image virt-exportserver-image \
                libguestfs-tools-rhel9-image libguestfs-tools-image \
                pr-helper-rhel9-image sidecar-shim-rhel9-image \
                virt-synchronization-controller-rhel9-image \
                virt-template-apiserver-rhel9-image virt-template-controller-rhel9-image \
                network-resources-injector-image; then
                VIRT_IMG=$(get_core "virt-operator${VER_SFX}-image")
                VIRT_SHA="${VIRT_IMG#*@}"
                if [[ "$VER_NUM" -lt 4013 ]]; then
                  # v4.12: SHA-based csv-generator API (kubevirt ≤0.58 style)
                  gen_csv "${CSV_BASE}/virt-csv/virt-csv-output.yaml" "${QUAY}/${VIRT_IMG}" /usr/bin/csv-generator \
                    "--namespace=${TARGET_NS}" "--operatorImageVersion=${OP_VER}" \
                    "--dockerPrefix=${CONTAINER_PFX}" "--kubeVirtVersion=${VIRT_SHA}" "--imagePrefix=" \
                    "--csvVersion=${CSV_VER}" "--replacesCsvVersion=${CSV_REPLACES}" \
                    "--apiSha=$(get_extra 'virt-api-image' | cut -d@ -f2)" \
                    "--controllerSha=$(get_extra 'virt-controller-image' | cut -d@ -f2)" \
                    "--handlerSha=$(get_extra 'virt-handler-image' | cut -d@ -f2)" \
                    "--launcherSha=$(get_extra 'virt-launcher-image' | cut -d@ -f2)" \
                    "--gsSha=$(get_extra 'libguestfs-tools-image' | cut -d@ -f2)" \
                    "--kubevirtLogo=kubevirtLogo" "--dumpCRDs"
                else
                  # v4.13+: image-ref API
                  CP_FLAG=""; PR_FLAG=""; SC_FLAG=""; SYNC_FLAG=""; TMPL_API_FLAG=""; TMPL_CTRL_FLAG=""
                  [[ "$VER_NUM" -ge 4021 ]] && CP_FLAG="--with-kubevirt-control-plane-label=true"
                  [[ "$VER_NUM" -ge 4014 ]] && PR_FLAG="--pr-helper-image=${CONTAINER_PFX}/$(get_extra 'pr-helper-rhel9-image')"
                  [[ "$VER_NUM" -ge 4016 ]] && SC_FLAG="--sidecar-shim-image=${CONTAINER_PFX}/$(get_extra 'sidecar-shim-rhel9-image')"
                  SYNC_IMG=$(get_extra "virt-synchronization-controller-rhel9-image")
                  [[ -n "$SYNC_IMG" ]] && SYNC_FLAG="--virt-synchronization-controller-image=${CONTAINER_PFX}/${SYNC_IMG}"
                  TMPL_API_IMG=$(get_extra "virt-template-apiserver-rhel9-image")
                  [[ -n "$TMPL_API_IMG" ]] && TMPL_API_FLAG="--virt-template-apiserver-image=${CONTAINER_PFX}/${TMPL_API_IMG}"
                  TMPL_CTRL_IMG=$(get_extra "virt-template-controller-rhel9-image")
                  [[ -n "$TMPL_CTRL_IMG" ]] && TMPL_CTRL_FLAG="--virt-template-controller-image=${CONTAINER_PFX}/${TMPL_CTRL_IMG}"
                  VIRT_ARGS=(
                    "--namespace=${TARGET_NS}" "--operatorImageVersion=${OP_VER}"
                    "--dockerPrefix=${CONTAINER_PFX}" "--kubeVirtVersion=${VIRT_SHA}" "--imagePrefix="
                    "--csvVersion=${CSV_VER}" "--replacesCsvVersion=${CSV_REPLACES}"
                    "--virt-api-image=${CONTAINER_PFX}/$(get_extra 'virt-api-rhel9-image')"
                    "--virt-controller-image=${CONTAINER_PFX}/$(get_extra 'virt-controller-rhel9-image')"
                    "--virt-handler-image=${CONTAINER_PFX}/$(get_extra 'virt-handler-rhel9-image')"
                    "--virt-launcher-image=${CONTAINER_PFX}/$(get_extra 'virt-launcher-rhel9-image')"
                    "--virt-export-proxy-image=${CONTAINER_PFX}/$(get_extra 'virt-exportproxy-rhel9-image')"
                    "--virt-export-server-image=${CONTAINER_PFX}/$(get_extra 'virt-exportserver-rhel9-image')"
                    "--gs-image=${CONTAINER_PFX}/$(get_extra 'libguestfs-tools-rhel9-image')"
                    "--virt-operator-image=${CONTAINER_PFX}/${VIRT_IMG}"
                    "--kubevirtLogo=kubevirtLogo" "--dumpCRDs"
                  )
                  [[ -n "$CP_FLAG" ]]        && VIRT_ARGS+=("${CP_FLAG}")
                  [[ -n "$PR_FLAG" ]]        && VIRT_ARGS+=("${PR_FLAG}")
                  [[ -n "$SC_FLAG" ]]        && VIRT_ARGS+=("${SC_FLAG}")
                  [[ -n "$SYNC_FLAG" ]]      && VIRT_ARGS+=("${SYNC_FLAG}")
                  [[ -n "$TMPL_API_FLAG" ]]  && VIRT_ARGS+=("${TMPL_API_FLAG}")
                  [[ -n "$TMPL_CTRL_FLAG" ]] && VIRT_ARGS+=("${TMPL_CTRL_FLAG}")
                  gen_csv "${CSV_BASE}/virt-csv/virt-csv-output.yaml" "${QUAY}/${VIRT_IMG}" /usr/bin/csv-generator "${VIRT_ARGS[@]}"
                fi
              else
                echo "  SKIP: virt not in operators list or no relevant image changed"
              fi

              # ─── SSP ────────────────────────────────────────────────────────────────────
              echo "=== SSP CSV ==="
              mkdir -p "${CSV_BASE}/ssp-csv"
              if has_op ssp && keys_changed \
                kubevirt-ssp-operator-rhel9-image kubevirt-ssp-operator-image \
                kubevirt-template-validator-rhel9-image kubevirt-template-validator-image \
                vm-console-proxy-rhel9-image \
                kubevirt-tekton-tasks-create-datavolume-rhel9-image \
                kubevirt-tekton-tasks-disk-virt-customize-rhel9-image virtio-win-rhel9-image; then
                SSP_IMG=$(get_core "kubevirt-ssp-operator${VER_SFX}-image")
                VM_PROXY_IMG=$(get_extra "vm-console-proxy${VER_SFX}-image")
                SSP_ARGS=(
                  "--csv-version=${CSV_VER}" "--namespace=${TARGET_NS}"
                  "--operator-image=${CONTAINER_PFX}/${SSP_IMG}"
                  "--validator-image=${CONTAINER_PFX}/$(get_extra "kubevirt-template-validator${VER_SFX}-image")"
                  "--dump-crds" "--operator-version=${OP_VER}"
                )
                [[ -n "$VM_PROXY_IMG" ]] && SSP_ARGS+=("--vm-console-proxy-image=${CONTAINER_PFX}/${VM_PROXY_IMG}")
                # v4.14-4.15: tekton-tasks and virtio images passed as env vars to the csv-generator
                if [[ "$VER_NUM" -ge 4014 && "$VER_NUM" -lt 4016 ]]; then
                  TK_IMG=$(get_extra "kubevirt-tekton-tasks-create-datavolume-rhel9-image")
                  DV_IMG=$(get_extra "kubevirt-tekton-tasks-disk-virt-customize-rhel9-image")
                  VW_IMG=$(get_extra "virtio-win-rhel9-image")
                  GEN_CSV_ENV=(
                    "TEKTON_TASKS_IMAGE=${CONTAINER_PFX}/${TK_IMG}"
                    "TEKTON_TASKS_DISK_VIRT_IMAGE=${CONTAINER_PFX}/${DV_IMG}"
                    "VIRTIO_IMG=${CONTAINER_PFX}/${VW_IMG}"
                  )
                fi
                gen_csv "${CSV_BASE}/ssp-csv/ssp-csv-output.yaml" "${QUAY}/${SSP_IMG}" /csv-generator "${SSP_ARGS[@]}"
              else
                echo "  SKIP: ssp not in operators list or no relevant image changed"
              fi

              # ─── CDI ────────────────────────────────────────────────────────────────────
              echo "=== CDI CSV ==="
              mkdir -p "${CSV_BASE}/cdi-csv"
              if has_op cdi && keys_changed \
                virt-cdi-operator-rhel9-image virt-cdi-operator-image \
                virt-cdi-controller-rhel9-image virt-cdi-controller-image \
                virt-cdi-importer-rhel9-image virt-cdi-importer-image \
                virt-cdi-cloner-rhel9-image virt-cdi-cloner-image \
                virt-cdi-apiserver-rhel9-image virt-cdi-apiserver-image \
                virt-cdi-uploadserver-rhel9-image virt-cdi-uploadserver-image \
                virt-cdi-uploadproxy-rhel9-image virt-cdi-uploadproxy-image \
                cdi-ovirt-populator-image; then
                CDI_IMG=$(get_core "virt-cdi-operator${VER_SFX}-image")
                OVIRT_IMG=$(get_extra 'cdi-ovirt-populator-image')
                CDI_ARGS=(
                  "--csv-version=${CSV_VER}" "--replaces-csv-version=${CSV_REPLACES}"
                  "--namespace=${TARGET_NS}" "--cdi-logo-base64=logo" "--operator-version=${OP_VER}"
                  "--operator-image=${CONTAINER_PFX}/${CDI_IMG}"
                  "--controller-image=${CONTAINER_PFX}/$(get_extra "virt-cdi-controller${VER_SFX}-image")"
                  "--importer-image=${CONTAINER_PFX}/$(get_extra "virt-cdi-importer${VER_SFX}-image")"
                  "--cloner-image=${CONTAINER_PFX}/$(get_extra "virt-cdi-cloner${VER_SFX}-image")"
                  "--apiserver-image=${CONTAINER_PFX}/$(get_extra "virt-cdi-apiserver${VER_SFX}-image")"
                  "--uploadproxy-image=${CONTAINER_PFX}/$(get_extra "virt-cdi-uploadproxy${VER_SFX}-image")"
                  "--uploadserver-image=${CONTAINER_PFX}/$(get_extra "virt-cdi-uploadserver${VER_SFX}-image")"
                  "--pull-policy=IfNotPresent" "--dump-crds"
                )
                # ovirt-populator absent in v4.14-v4.15
                [[ -n "$OVIRT_IMG" ]] && CDI_ARGS+=("--ovirt-populator-image=${OVIRT_IMG}")
                gen_csv "${CSV_BASE}/cdi-csv/cdi-csv-output.yaml" "${QUAY}/${CDI_IMG}" /usr/bin/csv-generator "${CDI_ARGS[@]}"
              else
                echo "  SKIP: cdi not in operators list or no relevant image changed"
              fi

              # ─── HPP ────────────────────────────────────────────────────────────────────
              echo "=== HPP CSV ==="
              mkdir -p "${CSV_BASE}/hpp-csv"
              if has_op hpp && keys_changed \
                hostpath-provisioner-operator-rhel9-image hostpath-provisioner-rhel8-operator-image \
                hostpath-provisioner-rhel9-image hostpath-provisioner-rhel8-image \
                hostpath-csi-driver-rhel9-image hostpath-csi-driver-image \
                csi-node-driver-rhel9-image csi-node-driver-image \
                csi-liveness-probe-rhel9-image csi-liveness-probe-image \
                csi-external-provisioner-rhel9-image csi-external-provisioner-image \
                csi-external-snapshotter-rhel9-image csi-external-snapshotter-image; then
                HPP_IMG=$(get_core "${HPP_OP_KEY}")
                gen_csv "${CSV_BASE}/hpp-csv/hpp-csv-output.yaml" "${QUAY}/${HPP_IMG}" /usr/bin/csv-generator \
                  "--csv-version=${CSV_VER}" \
                  "--operator-image-name=${CONTAINER_PFX}/${HPP_IMG}" \
                  "--provisioner-image-name=${CONTAINER_PFX}/$(get_extra "${HPP_PRV_KEY}")" \
                  "--csi-driver-image-name=${CONTAINER_PFX}/$(get_extra "${HPP_CSI_KEY}")" \
                  "--namespace=${TARGET_NS}" "--pull-policy=IfNotPresent" \
                  "--csi-node-driver-image-name=$(get_extra 'csi-node-driver-image')" \
                  "--csi-liveness-probe-image-name=$(get_extra 'csi-liveness-probe-image')" \
                  "--csi-external-provisioner-image-name=$(get_extra 'csi-external-provisioner-image')" \
                  "--csi-snapshotter-image-name=$(get_extra 'csi-external-snapshotter-image')" \
                  "--dump-crds"
              else
                echo "  SKIP: hpp not in operators list or no relevant image changed"
              fi

              # ─── AAQ ────────────────────────────────────────────────────────────────────
              echo "=== AAQ CSV ==="
              mkdir -p "${CSV_BASE}/aaq-csv"
              if has_op aaq && keys_changed \
                aaq-operator-rhel9-image aaq-controller-rhel9-image aaq-server-rhel9-image; then
                AAQ_IMG=$(get_core "aaq-operator-rhel9-image")
                gen_csv "${CSV_BASE}/aaq-csv/aaq-csv-output.yaml" "${QUAY}/${AAQ_IMG}" /usr/bin/csv-generator \
                  "--csv-version=${CSV_VER}" "--operator-version=${OP_VER}" \
                  "--operator-image=${CONTAINER_PFX}/${AAQ_IMG}" \
                  "--controller-image=${CONTAINER_PFX}/$(get_extra 'aaq-controller-rhel9-image')" \
                  "--aaq-server-image=${CONTAINER_PFX}/$(get_extra 'aaq-server-rhel9-image')" \
                  "--namespace=${TARGET_NS}" "--pull-policy=IfNotPresent" "--dump-crds"
              else
                echo "  SKIP: aaq not in operators list or no relevant image changed"
              fi

              # ─── MTQ ────────────────────────────────────────────────────────────────────
              echo "=== MTQ CSV ==="
              mkdir -p "${CSV_BASE}/mtq-csv"
              if has_op mtq && keys_changed \
                mtq-operator-rhel9-image mtq-controller-rhel9-image mtq-lock-server-rhel9-image; then
                MTQ_IMG=$(get_core "mtq-operator-rhel9-image")
                gen_csv "${CSV_BASE}/mtq-csv/mtq-csv-output.yaml" "${QUAY}/${MTQ_IMG}" /usr/bin/csv-generator \
                  "--csv-version=${CSV_VER}" "--operator-version=${OP_VER}" \
                  "--operator-image=${CONTAINER_PFX}/${MTQ_IMG}" \
                  "--controller-image=${CONTAINER_PFX}/$(get_extra 'mtq-controller-rhel9-image')" \
                  "--mtq-lock-server-image=${CONTAINER_PFX}/$(get_extra 'mtq-lock-server-rhel9-image')" \
                  "--namespace=${TARGET_NS}" "--dump-crds"
              else
                echo "  SKIP: mtq not in operators list or no relevant image changed"
              fi

              # ─── TTO ────────────────────────────────────────────────────────────────────
              echo "=== TTO CSV ==="
              mkdir -p "${CSV_BASE}/tto-csv"
              if has_op tto && keys_changed \
                kubevirt-tekton-tasks-operator-image kubevirt-tekton-tasks-operator-rhel9-image \
                kubevirt-tekton-tasks-wait-for-vmi-status-rhel9-image \
                kubevirt-tekton-tasks-modify-vm-template-rhel9-image \
                kubevirt-tekton-tasks-disk-virt-sysprep-rhel9-image \
                kubevirt-tekton-tasks-disk-virt-customize-rhel9-image \
                kubevirt-tekton-tasks-create-vm-from-template-rhel9-image \
                kubevirt-tekton-tasks-create-datavolume-rhel9-image \
                kubevirt-tekton-tasks-copy-template-rhel9-image \
                kubevirt-tekton-tasks-cleanup-vm-rhel9-image \
                virtio-win-rhel9-image; then
                TTO_IMG=$(get_core "kubevirt-tekton-tasks-operator-image")
                [[ -z "$TTO_IMG" ]] && TTO_IMG=$(jq -r '."kubevirt-tekton-tasks-operator-rhel9-image" // empty' "${CORE}")
                if [[ -n "$TTO_IMG" ]]; then
                  TTO_SFX="-image"; [[ "$VER_NUM" -ge 4013 ]] && TTO_SFX="-rhel9-image"
                  gen_csv "${CSV_BASE}/tto-csv/tto-csv-output.yaml" "${QUAY}/${TTO_IMG}" /csv-generator \
                    "--csv-version=${CSV_VER}" "--namespace=${TARGET_NS}" "--operator-version=${OP_VER}" \
                    "--operator-image=${CONTAINER_PFX}/${TTO_IMG}" "--pipelines-namespace=${TARGET_NS}" \
                    "--wait-for-vmi-status-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-wait-for-vmi-status${TTO_SFX}")" \
                    "--modify-vm-template-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-modify-vm-template${TTO_SFX}")" \
                    "--disk-virt-sysprep-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-disk-virt-sysprep${TTO_SFX}")" \
                    "--disk-virt-customize-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-disk-virt-customize${TTO_SFX}")" \
                    "--create-vm-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-create-vm-from-template${TTO_SFX}")" \
                    "--modify-data-object-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-create-datavolume${TTO_SFX}")" \
                    "--copy-template-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-copy-template${TTO_SFX}")" \
                    "--cleanup-vm-image=${CONTAINER_PFX}/$(get_extra "kubevirt-tekton-tasks-cleanup-vm${TTO_SFX}")" \
                    "--dump-crds"
                else
                  echo "  SKIP: tto image not found in core-params.json"
                fi
              else
                echo "  SKIP: tto not in operators list or no relevant image changed"
              fi

              # ─── Virt-migration ─────────────────────────────────────────────────────────
              echo "=== Virt-migration CSV ==="
              mkdir -p "${CSV_BASE}/virt-migration-csv"
              if has_op virt-migration && keys_changed \
                virt-migration-operator-rhel9-image virt-migration-controller-rhel9-image; then
                VM_IMG=$(get_core "virt-migration-operator-rhel9-image")
                gen_csv "${CSV_BASE}/virt-migration-csv/virt-migration-csv-output.yaml" \
                  "${QUAY}/${VM_IMG}" /usr/bin/csv-generator \
                  "--csv-version=${CSV_VER}" "--operator-version=${OP_VER}" \
                  "--operator-image=${CONTAINER_PFX}/${VM_IMG}" \
                  "--controller-image=${CONTAINER_PFX}/$(get_extra 'virt-migration-controller-rhel9-image')" \
                  "--namespace=${TARGET_NS}" "--pull-policy=IfNotPresent" "--dump-crds"
              else
                echo "  SKIP: virt-migration not in operators list or no relevant image changed"
              fi

              # ─── Virt-platform-autopilot ────────────────────────────────────────────────
              echo "=== Virt-platform-autopilot CSV ==="
              mkdir -p "${CSV_BASE}/virt-platform-autopilot-csv"
              if has_op virt-platform-autopilot && keys_changed \
                virt-platform-autopilot-rhel9-image kubevirt-metrics-exporter-rhel9-image; then
                VPA_IMG=$(get_core "virt-platform-autopilot-rhel9-image")
                VPA_ARGS=(
                  "--csv-version=${CSV_VER}" "--operator-version=${OP_VER}"
                  "--operator-image=${CONTAINER_PFX}/${VPA_IMG}"
                  "--namespace=${TARGET_NS}" "--pull-policy=IfNotPresent" "--dump-crds"
                )
                ME_IMG=$(get_extra "kubevirt-metrics-exporter-rhel9-image")
                [[ -n "$ME_IMG" ]] && VPA_ARGS+=("--additional-images=RELATED_IMAGE_KUBEVIRT_METRICS_EXPORTER:${CONTAINER_PFX}/${ME_IMG}")
                gen_csv "${CSV_BASE}/virt-platform-autopilot-csv/virt-platform-autopilot-csv-output.yaml" \
                  "${QUAY}/${VPA_IMG}" /usr/bin/csv-generator "${VPA_ARGS[@]}"
              else
                echo "  SKIP: virt-platform-autopilot not in operators list or no relevant image changed"
              fi

              # ─── HCO CRDs ───────────────────────────────────────────────────────────────
              echo "=== HCO CRDs ==="
              HCO_IMG=$(get_core "hyperconverged-cluster-operator${VER_SFX}-image")
              if [[ -n "$HCO_IMG" ]] && keys_changed hyperconverged-cluster-operator-rhel9-image hyperconverged-cluster-operator-image; then
                HCO_CTR=$(buildah from --authfile "${AUTH_FILE}" --storage-driver vfs "${QUAY}/${HCO_IMG}" 2>&1)
                if [[ $? -eq 0 ]]; then
                  buildah run --storage-driver vfs "${HCO_CTR}" -- \
                    bash -c 'if command -v /usr/local/bin/csv-merger &>/dev/null; then /usr/local/bin/csv-merger --output-mode=CRDs; else /usr/local/bin/crd-generator; fi' \
                    > "${CRD_DIR}/hco-crds-output.yaml" 2>&1 || echo "WARN: HCO CRD generation failed" >&2
                  buildah rm --storage-driver vfs "${HCO_CTR}" 2>/dev/null || true
                  echo "  OK: HCO CRDs written"
                else
                  echo "WARN: buildah from failed for HCO image: ${HCO_CTR}" >&2
                fi
              else
                echo "  SKIP: HCO image not changed or not found"
              fi

              # ─── Git commit and push ─────────────────────────────────────────────────────
              echo "=== Committing and pushing ==="
              git add components/hco-bundle-registry/csvs components/hco-bundle-registry/crds 2>/dev/null || true
              git add . 2>/dev/null || true

              if [[ -n "$(git status --porcelain)" ]]; then
                git commit -m "Update HCO bundle registry with new images and CSVs"
                git pull --rebase origin main
                git push origin main
                echo "│ OK: Changes pushed"
              else
                echo "│ SKIP: No changes detected"
              fi

              echo "=== generate-csvs step completed ==="
          - name: push-release-chart
            image: quay.io/redhat-user-workloads/ocp-virt-images-tenant/pipeline-tools@sha256:18f9f819e9393891ce7ae19414a5672786e3efb120bdeaa2c254d8ba5d8e2493
            env:
              - name: HOME
                value: /tmp
            envFrom:
              - secretRef:
                  name: hco-updater-gitlab-token
              - secretRef:
                  name: quay-builds-creds
            volumeMounts:
              - name: quay-creds
                mountPath: /tmp/quay-builds-creds
                readOnly: true
              - name: shared-data
                mountPath: /var/shared
            script: |
              #!/usr/bin/env bash

              # ============================================================
              # EXECUTION LAYER - Resilient wrapper for observability
              # ============================================================
              SCRIPT_START=$(date +%s)
              declare -a ACTION_LOG=()
              FINAL_EXIT_CODE=0

              # Enable debug mode if requested
              if [[ "$(params.DEBUG)" == "true" ]]; then
                set -x
              fi

              exec_action() {
                local action_name="$1"
                local timeout_secs="${2:-60}"
                shift 2
                local cmd="$*"
                
                local start_ts=$(date +%s)
                echo ""
                echo "┌─────────────────────────────────────────────────────────────"
                echo "│ ACTION: $action_name"
                echo "│ CMD: $cmd"
                echo "│ TIMEOUT: ${timeout_secs}s"
                echo "├─────────────────────────────────────────────────────────────"
                
                local output
                local exit_code
                output=$(timeout "$timeout_secs" bash -c "$cmd" 2>&1)
                exit_code=$?
                
                local end_ts=$(date +%s)
                local duration=$((end_ts - start_ts))
                
                if [[ -n "$output" ]]; then
                  echo "$output" | sed 's/^/│ /'
                fi
                
                local status
                if [[ $exit_code -eq 0 ]]; then
                  status="OK"
                elif [[ $exit_code -eq 124 ]]; then
                  status="TIMEOUT"
                else
                  status="FAILED"
                fi
                
                echo "├─────────────────────────────────────────────────────────────"
                echo "│ STATUS: $status (exit: $exit_code, duration: ${duration}s)"
                echo "└─────────────────────────────────────────────────────────────"
                
                ACTION_LOG+=("$status|$action_name|exit=$exit_code|${duration}s")
                return $exit_code
              }

              execution_summary() {
                local script_exit_code=$?
                local script_end=$(date +%s)
                local total_duration=$((script_end - SCRIPT_START))
                
                echo ""
                echo "╔═════════════════════════════════════════════════════════════"
                echo "║ EXECUTION SUMMARY - push-release-chart"
                echo "║ Total Duration: ${total_duration}s"
                echo "║ Final Exit Code: ${FINAL_EXIT_CODE:-$script_exit_code}"
                echo "╠═════════════════════════════════════════════════════════════"
                
                local ok_count=0 fail_count=0 timeout_count=0
                
                for entry in "${ACTION_LOG[@]}"; do
                  local status=$(echo "$entry" | cut -d'|' -f1)
                  local action=$(echo "$entry" | cut -d'|' -f2)
                  local details=$(echo "$entry" | cut -d'|' -f3-)
                  
                  case "$status" in
                    OK) ok_count=$((ok_count + 1)); echo "║ ✓ $action ($details)" ;;
                    FAILED) fail_count=$((fail_count + 1)); echo "║ ✗ $action ($details)" ;;
                    TIMEOUT) timeout_count=$((timeout_count + 1)); echo "║ ⏱ $action ($details)" ;;
                  esac
                done
                
                echo "╠═════════════════════════════════════════════════════════════"
                echo "║ OK: $ok_count | FAILED: $fail_count | TIMEOUT: $timeout_count"
                echo "╚═════════════════════════════════════════════════════════════"
                
                exit ${FINAL_EXIT_CODE:-$script_exit_code}
              }

              trap execution_summary EXIT

              # ============================================================
              # RUN LOGIC - Business logic with fail-fast behavior
              # ============================================================
              set -eo pipefail

              echo "=== PHASE 1: Checking if hco-bundle-registry release ==="
              if [[ "$(params.SNAPSHOT)" != *"hco-bundle-registry"* ]]; then
                ACTION_LOG+=("OK|Skip - Not hco-bundle-registry|exit=0|0s")
                echo "│ SKIP: Snapshot does not contain 'hco-bundle-registry'"
                FINAL_EXIT_CODE=0
                exit 0
              fi
              ACTION_LOG+=("OK|Validate snapshot type|exit=0|0s")
              echo "│ OK: This is an hco-bundle-registry release"

              echo "=== PHASE 2: Reading results from previous step ==="

              # Validate result files exist
              if [[ ! -f "/tekton/results/snapshots-to-release" ]]; then
                echo "ERROR: snapshots-to-release result file not found"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              if [[ ! -f "/tekton/results/bundle-version" ]]; then
                echo "ERROR: bundle-version result file not found"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate result files exist|exit=0|0s")

              SNAPSHOTS_TO_RELEASE=$(cat /tekton/results/snapshots-to-release)
              BUNDLE_VERSION=$(cat /tekton/results/bundle-version)

              if [[ -z "$BUNDLE_VERSION" ]]; then
                echo "ERROR: bundle-version is empty"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Read previous step results|exit=0|0s")

              XY=$(echo "$BUNDLE_VERSION" | cut -d'.' -f1,2 | tr '.' '-')
              echo "│ Bundle Version: $BUNDLE_VERSION"
              echo "│ XY Version: $XY"

              echo "=== PHASE 3: Loading configuration ==="
              CHART_NAME="hco-bundle-registry"
              SKELETON_REGISTRY="quay.io/openshift-virtualization/release-chart"
              TARGET_REGISTRY="quay.io/openshift-virtualization/konflux-builds/v${XY}"
              SKELETON_VERSION="$(params.SKELETON_CHART_VERSION)"
              echo "│ Chart Name: $CHART_NAME"
              echo "│ Skeleton Registry: $SKELETON_REGISTRY"
              echo "│ Target Registry: $TARGET_REGISTRY"
              echo "│ Skeleton Version: $SKELETON_VERSION"
              ACTION_LOG+=("OK|Load configuration|exit=0|0s")

              TMPDIR=$(mktemp -d)
              cd "$TMPDIR"

              echo "=== PHASE 4: Registry login ==="

              # Validate credentials file exists
              if [[ ! -f "/tmp/quay-builds-creds/.dockerconfigjson" ]]; then
                echo "ERROR: Quay credentials file not found at /tmp/quay-builds-creds/.dockerconfigjson"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              DOCKER_CONFIG=$(cat /tmp/quay-builds-creds/.dockerconfigjson)

              # Validate JSON
              if ! echo "$DOCKER_CONFIG" | jq -e . > /dev/null 2>&1; then
                echo "ERROR: Invalid JSON in docker config"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate credentials file|exit=0|0s")

              QUAY_USERNAME=$(echo "${DOCKER_CONFIG}" | jq -r '[.auths | to_entries[] | select(.key | contains("quay.io"))] | first | .value.username')
              QUAY_PASSWORD=$(echo "${DOCKER_CONFIG}" | jq -r '[.auths | to_entries[] | select(.key | contains("quay.io"))] | first | .value.password')

              if [[ -z "${QUAY_USERNAME}" || "${QUAY_USERNAME}" == "null" ]]; then
                echo "ERROR: Could not extract quay.io credentials from secret"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Extract Quay credentials|exit=0|0s")
              echo "│ OK: Extracted credentials for user: $QUAY_USERNAME"

              # Login directly -- password can't be piped through exec_action safely
              echo ""
              echo "┌─────────────────────────────────────────────────────────────"
              echo "│ ACTION: Login to Quay registry"
              echo "│ CMD: echo '***' | helm registry login quay.io --username '${QUAY_USERNAME}' --password-stdin"
              echo "│ TIMEOUT: 30s"
              echo "├─────────────────────────────────────────────────────────────"
              login_exit=0
              login_output=$(echo "${QUAY_PASSWORD}" | timeout 30 helm registry login quay.io --username "${QUAY_USERNAME}" --password-stdin 2>&1) || login_exit=$?
              if [[ -n "$login_output" ]]; then
                echo "$login_output" | sed 's/^/│ /'
              fi
              echo "├─────────────────────────────────────────────────────────────"
              if [[ $login_exit -eq 0 ]]; then
                echo "│ STATUS: OK (exit: 0, duration: 0s)"
                echo "└─────────────────────────────────────────────────────────────"
                ACTION_LOG+=("OK|Login to Quay registry|exit=0|0s")
              else
                echo "│ STATUS: FAILED (exit: $login_exit, duration: 0s)"
                echo "└─────────────────────────────────────────────────────────────"
                ACTION_LOG+=("FAILED|Login to Quay registry|exit=$login_exit|0s")
                echo "ERROR: Failed to login to Quay registry"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              echo "│ OK: Logged in to quay.io"

              echo "=== PHASE 5: Pulling skeleton chart ==="
              echo "│ Pulling: oci://${SKELETON_REGISTRY}/${CHART_NAME} --version ${SKELETON_VERSION}"

              if ! exec_action "Pull skeleton chart" 120 "helm pull 'oci://${SKELETON_REGISTRY}/${CHART_NAME}' --version '${SKELETON_VERSION}' --untar"; then
                echo "ERROR: Failed to pull skeleton chart"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              if [[ ! -d "${CHART_NAME}" ]]; then
                echo "ERROR: Chart directory ${CHART_NAME} not found after pull"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              cd "${CHART_NAME}"
              # Defense-in-depth: remove stale .tgz left by helm pull --untar
              rm -f "../${CHART_NAME}"-*.tgz "${CHART_NAME}"-*.tgz 2>/dev/null || true
              ACTION_LOG+=("OK|Cleanup stale tgz archives|exit=0|0s")
              echo "│ OK: Skeleton chart extracted"

              echo "=== PHASE 6: Hydrating Chart.yaml ==="

              if [[ ! -f "Chart.yaml" ]]; then
                echo "ERROR: Chart.yaml not found"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              # Transform 4.99.0-rhel9.2559 to 4.99.0-releases.2559 for clearer chart versioning
              SEMVER=$(echo "$BUNDLE_VERSION" | cut -d'-' -f1)
              RELEASE_NUM=$(echo "$BUNDLE_VERSION" | grep -oE '[0-9]+$')

              if [[ -z "$SEMVER" || -z "$RELEASE_NUM" ]]; then
                echo "ERROR: Failed to parse bundle version: $BUNDLE_VERSION"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              CHART_VERSION="${SEMVER}-releases.${RELEASE_NUM}"

              # Derive OS suffix from bundle version for chart name hydration
              # Current builds: 4.20.8-rhel9.47 → rhel9; future: rhel10
              # Defensive: legacy/null OS falls back to base CHART_NAME
              if [[ "$BUNDLE_VERSION" == *"-"* ]]; then
                OS_SUFFIX=$(echo "$BUNDLE_VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
                if [[ -n "$OS_SUFFIX" && "$OS_SUFFIX" != "null" ]]; then
                  HYDRATED_CHART_NAME="${CHART_NAME}-${OS_SUFFIX}"
                else
                  HYDRATED_CHART_NAME="${CHART_NAME}"
                fi
              else
                HYDRATED_CHART_NAME="${CHART_NAME}"
              fi

              APP_VERSION="v${BUNDLE_VERSION}"

              if ! exec_action "Hydrate Chart.yaml" 30 "yq -i '.name = \"${HYDRATED_CHART_NAME}\"' Chart.yaml && yq -i '.version = \"${CHART_VERSION}\"' Chart.yaml && yq -i '.appVersion = \"${APP_VERSION}\"' Chart.yaml"; then
                echo "ERROR: Failed to update Chart.yaml"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              echo "│ OK: Chart.yaml updated"
              echo "│   name: $HYDRATED_CHART_NAME"
              echo "│   version (OCI tag): $CHART_VERSION"
              echo "│   appVersion: $APP_VERSION"

              # Feedback loop: verify Chart.yaml was actually hydrated
              ACTUAL_NAME=$(yq '.name' Chart.yaml | tr -d '"')
              ACTUAL_VERSION=$(yq '.version' Chart.yaml | tr -d '"')
              if [[ "$ACTUAL_NAME" != "$HYDRATED_CHART_NAME" ]]; then
                echo "ERROR: Chart.yaml name hydration failed. Expected: $HYDRATED_CHART_NAME, Got: $ACTUAL_NAME"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              if [[ "$ACTUAL_VERSION" != "$CHART_VERSION" ]]; then
                echo "ERROR: Chart.yaml version hydration failed. Expected: $CHART_VERSION, Got: $ACTUAL_VERSION"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Verify Chart.yaml hydration|exit=0|0s")

              echo "=== PHASE 7: Hydrating values.yaml ==="

              if [[ ! -f "values.yaml" ]]; then
                echo "ERROR: values.yaml not found"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              if ! exec_action "Hydrate values.yaml" 30 "yq -i '.global.targetNamespace = \"v${XY}-openshift-virtualization-tenant\"' values.yaml && yq -i '.global.releasePlanSuffix = \"-releaseplan-prod\"' values.yaml"; then
                echo "ERROR: Failed to update values.yaml"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              echo "│ OK: Global values set"

              echo "=== PHASE 8: Injecting snapshots ==="

              # Validate snapshots JSON
              if ! echo "$SNAPSHOTS_TO_RELEASE" | jq -e . > /dev/null 2>&1; then
                echo "ERROR: Invalid JSON in snapshots-to-release"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate snapshots JSON|exit=0|0s")

              if ! exec_action "Inject snapshots" 30 "echo '$SNAPSHOTS_TO_RELEASE' | jq -r '{snapshots: .}' | yq eval -P '.' > /tmp/snapshots_with_key.yaml && yq eval-all '. as \$item ireduce ({}; . * \$item)' values.yaml /tmp/snapshots_with_key.yaml -i"; then
                echo "ERROR: Failed to inject snapshots"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              echo "│ OK: Snapshots injected into values.yaml"

              echo "=== PHASE 8b: Injecting Snapshot objects into chart ==="
              SNAPSHOT_OBJECTS_SRC="/var/shared/snapshot-objects"
              if ls "${SNAPSHOT_OBJECTS_SRC}"/*.yaml 1>/dev/null 2>&1; then
                cp "${SNAPSHOT_OBJECTS_SRC}"/*.yaml templates/
                SNAP_COUNT=$(ls "${SNAPSHOT_OBJECTS_SRC}"/*.yaml 2>/dev/null | wc -l)
                echo "│ Copied $SNAP_COUNT Snapshot files into chart templates/"
                ACTION_LOG+=("OK|Inject Snapshot objects ($SNAP_COUNT files)|exit=0|0s")
              else
                echo "│ WARN: No Snapshot object files found"
                ACTION_LOG+=("OK|Skip Snapshot objects (none found)|exit=0|0s")
              fi

              echo "=== PHASE 9: Validating chart ==="
              if ! exec_action "Lint chart" 30 "helm lint ."; then
                echo "ERROR: Chart validation failed"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              echo "│ OK: Chart passed validation"

              echo "=== PHASE 10: Packaging chart ==="
              if ! exec_action "Package chart" 30 "helm package ."; then
                echo "ERROR: Failed to package chart"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              PACKAGE_FILE="${HYDRATED_CHART_NAME}-${CHART_VERSION}.tgz"

              if [[ -z "${PACKAGE_FILE}" || ! -f "${PACKAGE_FILE}" ]]; then
                echo "ERROR: Failed to find packaged chart file"
                FINAL_EXIT_CODE=1
                exit 1
              fi
              ACTION_LOG+=("OK|Validate package file|exit=0|0s")
              echo "│ OK: Packaged as $PACKAGE_FILE"

              echo "=== PHASE 11: Pushing to OCI registry ==="
              if ! exec_action "Push to OCI registry" 120 "helm push '${PACKAGE_FILE}' 'oci://${TARGET_REGISTRY}'"; then
                echo "ERROR: Failed to push chart to registry"
                FINAL_EXIT_CODE=1
                exit 1
              fi

              echo "=== push-release-chart step completed ==="
              echo "│ Published ${HYDRATED_CHART_NAME}:${CHART_VERSION} to oci://${TARGET_REGISTRY} (file: ${PACKAGE_FILE})"
              FINAL_EXIT_CODE=0
